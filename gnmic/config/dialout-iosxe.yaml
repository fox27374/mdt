# Dial-out (gRPC, yang_grpc receiver in otel.yaml) subscriptions for IOS-XE switches that are not gnmic
# targets. Keep them in step with the xe_* subscriptions in mdt.yaml: same data, same intervals.
# Applied with scripts/dialout-apply, which replaces subscriptions 57001-57099 on the switch.
# Period is in seconds. One xpath per subscription (IOS-XE allows only one), so a subscription can
# cover more leaves than its gnmic counterpart; otel.yaml filter/cisco keeps only the ones used.

receiver:
  address: 172.24.89.69
  port: 57000

switches:  # name: address (gNMI, insecure, port 57400). Also in otel.yaml transform/cisco (mgmt_ip): keep in step.
  ibk-lab-sw11: 172.24.80.243
  ibk-lab-sw12: 172.24.80.242
  ibk-lab-sw13: 172.24.80.241
  ibk-lab-seminar: 172.24.80.238  # WS-C3850-24P, 16.12

subscriptions:
  - {id: 57001, gnmic: xe_cpu_stats, period: 60, xpath: /process-cpu-ios-xe-oper:cpu-usage/cpu-utilization/one-minute}
  - {id: 57002, gnmic: xe_mem_stats, period: 300, xpath: /memory-ios-xe-oper:memory-statistics/memory-statistic}
  # Status (xe_if_info) rides along: otel reads oper/admin status from the same entry as speed.
  - {id: 57003, gnmic: xe_if_stats xe_if_info, period: 30, xpath: /interfaces-ios-xe-oper:interfaces/interface}
  # CDP: whole entry; otel.yaml keeps device-name, interface (local-intf-name), port-id, platform-name, ip-address,
  # the leaves xe_cdp_info subscribes to in mdt.yaml.
  - {id: 57004, gnmic: xe_cdp_info, period: 60, xpath: /cdp-ios-xe-oper:cdp-neighbor-details/cdp-neighbor-detail}
  - {id: 57005, gnmic: xe_mac_info, period: 300, xpath: /matm-ios-xe-oper:matm-oper-data/matm-table/matm-mac-entry}
  - {id: 57006, gnmic: xe_poe_stats, period: 300, xpath: /poe-ios-xe-oper:poe-oper-data/poe-switch}
  - {id: 57007, gnmic: xe_poe_stats, period: 300, xpath: /poe-ios-xe-oper:poe-oper-data/poe-port-detail}
  # device-hardware-oper (what gnmic reads) is accepted but never sent on 16.12; platform-oper part-no is.
  - {id: 57008, gnmic: xe_inventory, period: 3600, xpath: /platform-ios-xe-oper:components/component/state/part-no}
  - {id: 57009, gnmic: xe_arp_info, period: 300, xpath: /arp-ios-xe-oper:arp-data/arp-vrf/arp-oper}
  # openconfig on 16.12 only with the short module prefixes (oc-if:, oc-eth:, oc-lag:, oc-vlan:); the full module names
  # are "Invalid XPath filter". aggregation/switched-vlan (the port-channel's VLANs, what gnmic reads) is accepted but never
  # sent, so 57011 reads the VLANs of the physical ports instead: mdt_lag_vlans takes a port-channel's from its members,
  # and mdt_mac uses them for the VLAN of a learned MAC (the receiver drops the MAC table's numeric vlan-id-number key).
  - {id: 57010, gnmic: xe_lag_info, period: 300, xpath: /oc-if:interfaces/interface/oc-eth:ethernet/state/oc-lag:aggregate-id}
  - {id: 57011, gnmic: xe_lag_info, period: 300, xpath: /oc-if:interfaces/interface/oc-eth:ethernet/oc-vlan:switched-vlan/state}
