      - xe_cpu_stats
      - xe_mem_stats
      - xe_poe_stats
      - xe_if_info
      - xe_cdp_info
      - xe_mac_info
      - xe_arp_info
      - xe_lag_info
      - xe_inventory

  10.20.0.35:57400:
    name: "ibk-lab-edge02"
    subscriptions:
      - xe_if_stats
      - xe_cpu_stats
      - xe_mem_stats
      - xe_poe_stats
      - xe_if_info
      - xe_cdp_info
      - xe_mac_info
