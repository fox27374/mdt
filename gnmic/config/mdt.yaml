###################################
# Global
###################################

username: "${SWITCH_USERNAME}"
password: "${SWITCH_PASSWORD}"
insecure: false
skip-verify: true

###################################
# Clustering
###################################

api: "${GNMIC_CLUSTERING_SERVICE_NAME}:8800"
api-server:
  enable-metrics: true
clustering:
  cluster-name: mdt
  locker:
    type: consul
    address: consul:8500
    tls:
      skip-verify: true


###################################
# Targets
###################################

