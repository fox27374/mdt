  # PaloAlto Firewalls
  172.24.88.157:9339:
    name: "Lab-IBK-PA560-2"
    username: "${FW_USERNAME}"
    password: "${FW_PASSWORD}"
    subscriptions:
      - panos_if_stats
      - panos_cpu_stats
      - panos_session_stats

###################################
# Subscriptions
###################################

subscriptions:
  xe_if_stats:
    paths:
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/statistics/in-octets"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/statistics/out-octets"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/statistics/in-errors"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/statistics/out-errors"
      # Error breakdown: which kind of frame makes up in-errors.
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/statistics/in-crc-errors"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/ether-stats/in-oversize-frames"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/ether-stats/in-undersize-frames"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/ether-stats/in-fragment-frames"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/ether-stats/in-jabber-frames"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/speed"
    mode: stream
    encoding: json_ietf
    stream-mode: sample
    sample-interval: 30s
    outputs:
      - nats

  xe_cpu_stats:
    paths:
      - "rfc7951:/Cisco-IOS-XE-process-cpu-oper:cpu-usage/cpu-utilization/one-minute"
    mode: stream
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  xe_mem_stats:
    paths:
      - "rfc7951:/Cisco-IOS-XE-memory-oper:memory-statistics/memory-statistic/total-memory"
      - "rfc7951:/Cisco-IOS-XE-memory-oper:memory-statistics/memory-statistic/used-memory"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  xe_poe_stats:
    paths:
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-switch/power-budget"
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-switch/power-allocated"
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-switch/consumed-poe-power"
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-switch/available-power"
      # Per port (list key intf-name; poe-port stays empty on 17.x, poe-port-detail lists the ports with a device).
      # Each leaf is its own event: power-consumption (W drawn) is a number, oper-state and pd-class are strings,
      # which the Prometheus output keeps as labels on a value-1 series (like xe_if_info).
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-port-detail/power-consumption"
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-port-detail/oper-state"
      - "rfc7951:/Cisco-IOS-XE-poe-oper:poe-oper-data/poe-port-detail/pd-class"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  xe_if_info:
    paths:
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/admin-status"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/oper-status"
      - "rfc7951:/Cisco-IOS-XE-interfaces-oper:interfaces/interface/last-change"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  xe_cdp_info:
    paths:
      - "rfc7951:/Cisco-IOS-XE-cdp-oper:cdp-neighbor-details/cdp-neighbor-detail/device-name"
      - "rfc7951:/Cisco-IOS-XE-cdp-oper:cdp-neighbor-details/cdp-neighbor-detail/local-intf-name"
      - "rfc7951:/Cisco-IOS-XE-cdp-oper:cdp-neighbor-details/cdp-neighbor-detail/port-id"
    mode: stream
    stream-mode: sample
    # Lab value; production can go back to a longer interval.
    sample-interval: 60s
    outputs:
      - nats

  xe_mac_info:
    paths:
      # The port leaf, not the whole entry: as an event per MAC its keys (mac, vlan) become labels
      # and the port a string value, which the Prometheus output keeps (strings-as-labels).
      - "rfc7951:/Cisco-IOS-XE-matm-oper:matm-oper-data/matm-table/matm-mac-entry/port"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  # ARP table (all VRFs), one event per leaf and entry like xe_mac_info: address and vrf are the keys (labels), hardware
  # (MAC) and interface are strings (labels). mode tells the switch's own addresses (interface mode) from learned ones; the
  # Client Search dashboard drops those, because they are the switch's own SVIs and routed ports, not clients.
  xe_arp_info:
    paths:
      - "rfc7951:/Cisco-IOS-XE-arp-oper:arp-data/arp-vrf/arp-oper/hardware"
      - "rfc7951:/Cisco-IOS-XE-arp-oper:arp-data/arp-vrf/arp-oper/interface"
      - "rfc7951:/Cisco-IOS-XE-arp-oper:arp-data/arp-vrf/arp-oper/mode"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  # Chassis part number per stack member (hw-dev-index = member number). The leaf path gives one event per
  # inventory entry, keyed by device-inventory_hw-type and device-inventory_hw-dev-index; drop-xe-inventory-non-chassis
  # keeps the chassis rows. Hourly: the part number does not change between reboots and the lab has no stacks to check against.
  xe_inventory:
    paths:
      - "rfc7951:/Cisco-IOS-XE-device-hardware-oper:device-hardware-data/device-hardware/device-inventory/part-number"
    mode: stream
    stream-mode: sample
    sample-interval: 3600s
    outputs:
      - nats

  # Port-channel membership and switchport VLANs (openconfig), 300 s. aggregate-id on a member port names its port-channel.
  # The VLANs are the port-channel's own switched-vlan. trunk-vlans is only filled for a restricted trunk; empty means all VLANs.
  # Empty values (ports that are not members, no access VLAN) are dropped by drop-xe-lag-empty.
  xe_lag_info:
    paths:
      - "openconfig:/interfaces/interface/ethernet/state/aggregate-id"
      - "openconfig:/interfaces/interface/aggregation/switched-vlan/state/interface-mode"
      - "openconfig:/interfaces/interface/aggregation/switched-vlan/state/access-vlan"
      - "openconfig:/interfaces/interface/aggregation/switched-vlan/config/trunk-vlans"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  nx_if_stats:
    paths:
      - "openconfig:/interfaces/interface/state/counters/in-octets"
      - "openconfig:/interfaces/interface/state/counters/out-octets"
      - "openconfig:/interfaces/interface/state/counters/in-errors"
      - "openconfig:/interfaces/interface/state/counters/out-errors"
      # The counters container, not all of ethernet/state (19 leaves per port: MACs, duplex, speed, ...).
      # NX-OS sends nothing for the single counter leaves. delete-nx-if-stats-fields drops the unused ones.
      - "openconfig:/interfaces/interface/ethernet/state/counters"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 30s
    outputs:
      - nats

  # Transmit side of the error breakdown; the receive side (in-crc-errors, in-oversize-frames, ...)
  # comes with nx_if_stats (openconfig ethernet/state/counters).
  nx_if_errors:
    paths:
      - "/Cisco-NX-OS-device:System/intf-items/phys-items/PhysIf-list/dbgDot3Stats-items/internalMacTransmitErrors"
      - "/Cisco-NX-OS-device:System/intf-items/phys-items/PhysIf-list/dbgEtherStats-items/txOversizePkts"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  nx_cpu_stats:
    paths:
      # Idle % over all cores; CPU % = 100 - idle.
      - "/Cisco-NX-OS-device:System/procsys-items/syscpusummary-items/idle"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  nx_mem_stats:
    paths:
      - "/Cisco-NX-OS-device:System/procsys-items/sysmem-items/sysmemusage-items/curr"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  nx_if_info:
    paths:
      - "openconfig:/interfaces/interface/state/admin-status"
      - "openconfig:/interfaces/interface/state/oper-status"
      - "openconfig:/interfaces/interface/state/last-change"
      - "openconfig:/interfaces/interface/oc-eth:ethernet/oc-eth:state/port-speed"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  # Port-channels (AggrIf-list, DME). The device sends the whole list per sample (AggrIf-list.N/...); nx-normalize-interfaces
  # splits it per port-channel (key id, po103) and each leaf becomes a metric with its value as the label. operMode is the
  # operational switchport mode (access or trunk), operSpeed the bundle speed (25G, auto when no member is up). The top-level
  # mode leaf is always trunk, so it is not used. tDn is a member port, renamed to member. The entry has ~150 more leaves;
  # only these are subscribed.
  nx_lag_info:
    paths:
      - "/System/intf-items/aggr-items/AggrIf-list/aggrif-items/operMode"
      - "/System/intf-items/aggr-items/AggrIf-list/aggrif-items/operSpeed"
      - "/System/intf-items/aggr-items/AggrIf-list/accessVlan"
      - "/System/intf-items/aggr-items/AggrIf-list/trunkVlans"
      - "/System/intf-items/aggr-items/AggrIf-list/rsmbrIfs-items/RsMbrIfs-list/tDn"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  nx_cdp_info:
    paths:
      - "/System/cdp-items/inst-items/if-items/If-list/adj-items/AdjEp-list/devId"
      - "/System/cdp-items/inst-items/if-items/If-list/adj-items/AdjEp-list/portId"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  nx_mac_info:
    paths:
      - "/System/mac-items/table-items/vlan-items/MacAddressEntry-list"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  wl_client_stats:
    paths:
      # Client Signal Strength (1.1.1)
      # Client Noise (1.1.2)
      # Client SNR (1.1.3)
      # Client transfer rates (1.2.1)
      # To compute a loss rate, divide data-retries by pkts-tx (also in traffic-stats). A ratio above ~5-10% is generally considered problematic.
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/data-retries"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/tx-excessive-retries"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/pkts-tx"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/pkts-rx"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/bytes-tx"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/bytes-rx"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/speed"
      # Rate not always a number: e.g. m7
      # - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/current-rate"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/most-recent-rssi"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/traffic-stats/most-recent-snr"
      # Client count by AP from client view (1.2.2) - no metrics
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/dot11-oper-data/ap-mac-address"
    mode: stream
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  wl_ap_stats:
    paths:
      # Client count by AP and SSID (1.2.2)
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ssid-counters/num-assoc-clients"
      # AP channel util, noise (1.1.2)
      - "rfc7951:/Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/rrm-measurement/load/rx-util-percentage"
      - "rfc7951:/Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/rrm-measurement/load/tx-util-percentage"
      - "rfc7951:/Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/rrm-measurement/load/rx-noise-channel-utilization"
      - "rfc7951:/Cisco-IOS-XE-wireless-rrm-oper:rrm-oper-data/rrm-measurement/load/non-wifi-inter"
    mode: stream
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  wl_info:
    paths:
      # AP mac-name mapping
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ap-name-mac-map/eth-mac"
      # AP mac-ip mapping
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/oper-data/ap-ip-data/ap-ip-addr"
      # AP ethernet mac to radio mac mapping
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/ethernet-mac-wtp-mac-map"
      # AP join state and configured location. APs not joined (e.g. downloading an image) are missing here.
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/capwap-data/ap-state/ap-operation-state"
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/capwap-data/ap-location/location"
      # Switch each AP is connected to (AP's CDP neighbour; list keys device-id and mac-addr become labels)
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/cdp-cache-data/ap-name"
      # Client mac-name mapping
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/client-wsa-info/device-hostname"
      # Client mac-ip mapping
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/sisf-db-mac/ipv4-binding/ip-key/ip-addr"
      # Client SSID mapping
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/dot11-oper-data/vap-ssid"
      # Client PHY (802.11g/n/ac/ax), channel and AP radio slot (band)
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/dot11-oper-data/ewlc-ms-phy-type"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/dot11-oper-data/current-channel"
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/dot11-oper-data/ms-ap-slot-id"
      # WLAN id to SSID: ssid-counters (wl_ap_stats) carry only the WLAN id
      - "rfc7951:/Cisco-IOS-XE-wireless-wlan-cfg:wlan-cfg-data/wlan-cfg-entries/wlan-cfg-entry/wlan-id"
      - "rfc7951:/Cisco-IOS-XE-wireless-wlan-cfg:wlan-cfg-data/wlan-cfg-entries/wlan-cfg-entry/apf-vap-id-data/ssid"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  # AP radios: state, channel, width and transmit power
  wl_radio_info:
    paths:
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data/oper-state"
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data/admin-state"
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data/phy-ht-cfg/cfg-data/curr-freq"
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data/phy-ht-cfg/cfg-data/chan-width"
      - "rfc7951:/Cisco-IOS-XE-wireless-access-point-oper:access-point-oper-data/radio-oper-data/radio-band-info/phy-tx-pwr-lvl-cfg/cfg-data/curr-tx-power-in-dbm"
    mode: stream
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

  # Association history per client (mm-if-client-history/mobility-history): one entry per association.
  # The list has no key, so the entries are indexed by position; wl-split-roam-history makes one event per entry.
  wl_client_roam:
    paths:
      - "rfc7951:/Cisco-IOS-XE-wireless-client-oper:client-oper-data/mm-if-client-history"
    mode: stream
    encoding: json_ietf
    stream-mode: sample
    sample-interval: 60s
    outputs:
      - nats

  panos_if_stats:
    paths:
      - "oc-if:/interfaces/interface/state/counters/in-octets"
      - "oc-if:/interfaces/interface/state/counters/out-octets"
      - "oc-if:/interfaces/interface/state/counters/in-errors"
      - "oc-if:/interfaces/interface/state/counters/out-errors"
    mode: stream
    sample-interval: 30s
    outputs:
      - nats

  panos_cpu_stats:
    paths:
      - "oc-sys:/system/cpus/cpu[index=ALL]"
    mode: stream
    sample-interval: 300s
    outputs:
      - nats
  
  panos_session_stats:
    paths:
      - "/pan/session/state"
    mode: stream
    sample-interval: 60s
    outputs:
      - nats




###################################
# Processors
###################################

  # ARP adjacencies (DME), one event per entry, split per entry by nx-normalize-interfaces. Own addresses are dropped in the dashboard.
  nx_arp_info:
    paths:
      - "/System/arp-items/inst-items/dom-items/Dom-list/db-items/Db-list/adj-items/AdjEp-list"
    mode: stream
    encoding: json
    stream-mode: sample
    sample-interval: 300s
    outputs:
      - nats

processors:
  rename-metrics:
    event-strings:
      value-names:
        - ".*"
      transforms:
        - path-base:
            apply-on: "name"

  # Management ports: NX-OS mgmt0, IOS-XE GigabitEthernet0/0. Port-channels (po, Port-channel) are kept: status, counters and
  # members are used by Switch Details. Aggregate totals stay physical-only in the dashboards (mdt_is_physical).
  drop-if-stats-interfaces:
    event-drop:
      condition: '.tags.interface_name != null and (.tags.interface_name | test("^(vlan|loopback|tunnel|app|nve|bluetooth|mgmt|GigabitEthernet0/0$)"; "i"))'

  # PoE port entries are keyed by intf-name (tag poe-port-detail_intf-name); give them the interface_name tag the other XE interface data uses.
  xe-poe-port-interface:
    event-jq:
      expression: |
        .[] |
        if (.tags["subscription-name"] == "xe_poe_stats" and (.tags["poe-port-detail_intf-name"] // .tags["intf-name"]) != null) then
          .tags.interface_name = (.tags["poe-port-detail_intf-name"] // .tags["intf-name"])
        else . end
  # The switch's own MACs (port CPU) are not learned addresses.
  drop-xe-mac-cpu:
    event-drop:
      condition: '.tags["subscription-name"] == "xe_mac_info" and (.values | to_entries | any(.value == "CPU"))'

  # Ports that are not members, and VLAN leaves not set, come as empty strings or lists: no series for them.
  drop-xe-lag-empty:
    event-drop:
      condition: '.tags["subscription-name"] == "xe_lag_info" and ([.values[] | select(. != "" and . != [] and . != null)] | length == 0)'

  drop-xe-inventory-non-chassis:
    event-drop:
      condition: '.tags["subscription-name"] == "xe_inventory" and .tags["device-inventory_hw-type"] != "hw-type-chassis"'

  # IOS-XE pads part numbers with spaces; trim them so the label is clean.
  trim-xe-inventory:
    event-jq:
      expression: |
        .[] |
        if .tags["subscription-name"] == "xe_inventory" then
          .values |= map_values(if type == "string" then gsub("^\\s+|\\s+$"; "") else . end)
        else . end

  # Pause and MAC control frames from ethernet/state/counters; no dashboard uses them.
  delete-nx-if-stats-fields:
    event-delete:
      value-names:
        - "^(.*/)?(in|out)-mac-(control|pause)-frames$"

  delete-nx-cdp-fields:
    event-delete:
      value-names:
        - "^.*adjExpTs$"
        - "^.*index$"
        - "^.*intf-items$"
        - "^.*adjstats-items$"
        - "^.*cap$"
        - "^.*duplex$"
        - "^.*intf-items$"
        - "^.*localMAC$"
        - "^.*sysLoc$"
        - "^.*mgmt-items$"
        - "^.*mtu$"
        - "^.*nativeVlan$"
        - "^.*remoteMAC$"
        - "^.*sysLoc$"
        - "^.*ver$"

  nx-normalize-interfaces:
    event-jq:
      expression: |
        # NX-OS sends whole lists as one event with indexed keys (interface.3/name,
        # If-list.3/adj-items/AdjEp-list.0/devId). Without splitting them per list entry,
        # path-base renaming collapses every entry onto the same metric name.
        .[] |
        . as $ev |
        # One object per list entry: {<last path element>: value, ...}
        def rows($re): [$ev.values | to_entries[]
            | {idx: (.key | capture($re) | .idx), f: (.key | split("/") | last), v: .value}]
          | group_by(.idx) | map(map({(.f): .v}) | add);
        def entry($tags; $values): {name: $ev.name, timestamp: $ev.timestamp,
          tags: ($ev.tags + ($tags | map_values(tostring))), values: $values};
        if ($ev.tags["subscription-name"] == "nx_cdp_info") then
          # ponytail: one neighbour per port; a second adjacency on the same port is dropped
          # devId and portId arrive as separate events (one per path): each becomes its own metric, joined by port in mdt_cdp.
          rows("If-list\\.(?P<idx>[0-9]+)/")[] | select(.devId != null or .portId != null)
          | entry({interface_name: .id}; {devId: .devId, portId: .portId} | with_entries(select(.value != null)))
        elif ($ev.tags["subscription-name"] == "nx_if_errors") then
          rows("PhysIf-list\\.(?P<idx>[0-9]+)/")[] | select(.id != null)
          | entry({interface_name: .id}; del(.id))
        elif ($ev.tags["subscription-name"] == "nx_mac_info") then
          # supeth1 is the supervisor (CPU): its own MACs, not learned ones
          rows("MacAddressEntry-list\\.(?P<idx>[0-9]+)/")[] | select((.port // "") | test("^sup"; "i") | not)
          | entry({port: .port, vlan: .vlan, mac: .macAddress, type: .type}; {age: .age})
        elif ($ev.tags["subscription-name"] == "nx_lag_info") then
          # Port-channels (AggrIf-list.N/...): one event per leaf, keyed by the port-channel name (the N/id leaf). A member
          # (RsMbrIfs-list.M/tDn) becomes member="eth1/3". Each leaf is its own metric with its value as the label.
          ($ev.values | to_entries) as $kv
          | ([$kv[] | select(.key | test("AggrIf-list\\.[0-9]+/id$")) | {(.key | capture("AggrIf-list\\.(?<i>[0-9]+)/").i): .value}] | add) as $names
          | $kv[] | select(.key | test("AggrIf-list\\.[0-9]+/(aggrif-items/operMode|aggrif-items/operSpeed|accessVlan|trunkVlans)$|RsMbrIfs-list\\.[0-9]+/tDn$")) | . as $leaf
          | ($leaf.key | capture("AggrIf-list\\.(?<i>[0-9]+)/").i) as $i
          | entry({interface_name: $names[$i]};
              if ($leaf.key | endswith("/tDn"))
              then {member: (try ($leaf.value | capture("id='(?<m>[^']+)'").m) catch $leaf.value)}
              elif ($leaf.key | endswith("/operMode")) then {mode: $leaf.value}
              else {($leaf.key | split("/") | last): $leaf.value} end)
        elif ($ev.tags["subscription-name"] == "nx_arp_info") then
          # One object per AdjEp entry: the leaves of an entry share the path before the leaf name.
          ([$ev.values | to_entries[] | {idx: (.key | split("/") | .[:-1] | join("/")), f: (.key | split("/") | last), v: .value}]
           | group_by(.idx) | map(map({(.f): .v}) | add))[]
          # INCOMPLETE entries (all-zero MAC, no reply yet) are no client. The table has no VRF leaf on this path.
          | select(.ip != null and .mac != null and .mac != "00:00:00:00:00:00")
          | entry({arp_oper_address: .ip, vlan: .ifId}; {hardware: .mac, interface: .physIfId})
        elif ($ev.tags["subscription-name"] == "nx_if_stats" or $ev.tags["subscription-name"] == "nx_if_info") then
          ( $ev.values | to_entries
            | group_by(.key | capture("interface\\.(?P<idx>[0-9]+)/") | .idx)
            | map({
                interface_name: (map(select(.key | test("/name$"))) | first | .value),
                counters: map(select(.key | test("/name$") | not))
              })
            | map(
                . as $grp |
                $grp.counters[] |
                {
                  name: $ev.name,
                  timestamp: $ev.timestamp,
                  tags: ($ev.tags + {interface_name: $grp.interface_name}),
                  values: {(.key): .value}
                }
              )
            | .[]
          )
        else
          $ev
        end

  # WLC roaming history: one event per mobility-history entry (association), so each association is its own
  # series. Identity is client MAC + assoc time, never the list index (the WLC shifts indices). Only run-latency
  # (ms, association to RUN state) is a metric; the rest become labels. Strings are tags, so they stay labels.
  wl-split-roam-history:
    event-jq:
      expression: |
        .[] |
        . as $ev |
        if ($ev.tags["subscription-name"] == "wl_client_roam") then
          # Leaves grouped per entry index, which is only used inside this event and not kept.
          ([$ev.values | to_entries[] | select(.key | test("/mobility-history/entry\\.[0-9]+/"))
            | {idx: (.key | capture("/entry\\.(?P<idx>[0-9]+)/") | .idx), f: (.key | split("/") | last), v: .value}]
           | group_by(.idx) | map(map({(.f): .v}) | add)) as $entries
          # Subscribe events carry the MAC only as the list-key tag; get events also have it as a value.
          | ([($ev.tags | to_entries[] | select(.key | endswith("client-mac")) | .value),
              ($ev.values | to_entries[] | select(.key | endswith("/client-mac")) | .value)][0]) as $mac
          | $entries[] | select(.["run-latency"] != null)
          | {name: $ev.name, timestamp: $ev.timestamp,
             tags: (($ev.tags | with_entries(select(.key | endswith("client-mac") | not)))
               + ({client_mac: $mac, ap_name: .["ap-name"], bssid: .bssid, slot: .["ms-ap-slot-id"],
                   roam_type: .["dot11-roam-type"], assoc_time: .["ms-assoc-time"]} | map_values(tostring))),
             values: {"run-latency": .["run-latency"]}}
        else $ev end


###################################
# Outputs
###################################

outputs:
  nats:
    type: nats
    address: nats:4222
    subject: mdt
    event-processors:
      - wl-split-roam-history
      - nx-normalize-interfaces
      - delete-nx-if-stats-fields
      - xe-poe-port-interface
      - drop-if-stats-interfaces
      - drop-xe-mac-cpu
      - drop-xe-lag-empty
      - drop-xe-inventory-non-chassis
      - trim-xe-inventory
      - rename-metrics

