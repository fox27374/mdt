  172.24.80.232:57400:
    name: "ibk-lab-border02"
    subscriptions:
      - xe_if_stats
      - xe_cpu_stats
      - xe_mem_stats
      - xe_if_info
      - xe_cdp_info
      - xe_mac_info
      - xe_arp_info
      - xe_lag_info
