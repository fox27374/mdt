extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  yang_grpc:
    endpoint: "0.0.0.0:57000"

  prometheus/gnmic:
    config:
      scrape_configs:
      - job_name: "gnmic"
        scrape_interval: 60s
        static_configs:
        - targets: ["gnmic-output:9273"]

  hostmetrics:
    collection_interval: 10s
    root_path: /hostfs
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:

processors:
  batch:

exporters:
  splunk_hec/splunkfree:
    token: "${env:SPLUNK_HEC_TOKEN}"
    endpoint: "https://172.24.89.194:8088/services/collector"
    tls:
      insecure_skip_verify: true
    source: "otel"
    sourcetype: "otel"
    index: "cisco_metrics"
    profiling_data_enabled: false

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [prometheus/gnmic, hostmetrics]
      processors: [batch]
      exporters: [splunk_hec/splunkfree]
    metrics/test:
      receivers: [yang_grpc]
      processors: [batch]
      exporters: [splunk_hec/splunkfree]
  extensions: [health_check, pprof, zpages]
