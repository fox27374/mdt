extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  yang_grpc:
    endpoint: "0.0.0.0:57000"

  prometheus/gnmic:
    config:
      # gnmic-output serves the latest value of every series, so each scrape stores a copy. One job per
      # gnmic sample-interval (subscriptions in mdt.yaml) stores each sample once. Keep these lists in step
      # with mdt.yaml; anything not listed falls into the 300s job, so a new subscription is never lost.
      scrape_configs:
      - job_name: "gnmic-30s"
        scrape_interval: 30s
        static_configs:
        - targets: ["gnmic-output:9273"]
        metric_relabel_configs:
        - source_labels: [subscription_name]
          regex: "(xe|nx|panos)_if_stats"
          action: keep
      - job_name: "gnmic-60s"
        scrape_interval: 60s
        static_configs:
        - targets: ["gnmic-output:9273"]
        metric_relabel_configs:
        - source_labels: [subscription_name]
          regex: "xe_cpu_stats|xe_cdp_info|nx_if_errors|nx_cpu_stats|nx_cdp_info|nx_lldp_info|wl_client_stats|wl_client_roam|wl_ap_stats|panos_session_stats"
          action: keep
      # 300s and slower (xe_inventory samples hourly; its series expire after 330s, so it is stored once or twice per hour).
      - job_name: "gnmic-300s"
        scrape_interval: 300s
        static_configs:
        - targets: ["gnmic-output:9273"]
        metric_relabel_configs:
        - source_labels: [subscription_name]
          regex: "(xe|nx|panos)_if_stats|xe_cpu_stats|xe_cdp_info|nx_if_errors|nx_cpu_stats|nx_cdp_info|nx_lldp_info|wl_client_stats|wl_client_roam|wl_ap_stats|panos_session_stats"
          action: drop

  # Switch syslog, UDP 514 on the host (compose maps it to 9514). Formats:
  #   IOS-XE: <189>6744: ibk-lab-sw98: %SYS-5-CONFIG_I: Configured from console by ...
  #   NX-OS:  <189>NTSNXSW01: 2026 Oct 24 10:31:40 CEST: %ETHPORT-5-IF_UP: Interface loopback999 is up
  # Severity comes from the priority (<189> = facility 23, severity 5). Lines without a message type
  # (hwidb noise) keep their text after the host as message.
  udp_log/syslog:
    listen_address: 0.0.0.0:9514
    operators:
      - type: regex_parser
        regex: '^<(?P<pri>\d+)>(?:\d+:\s*)?(?P<host>[^:\s]+):\s(?:.*?%(?P<message_type>[A-Za-z0-9_]+-\d-[A-Za-z0-9_]+):\s*)?(?P<message>.*?)\s*$'
        on_error: send_quiet

  hostmetrics:
    collection_interval: 10s
    root_path: /hostfs
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:

processors:
  batch:

  # Same filter as the old Cribl syslog pipeline: certificate and hwidb noise.
  filter/syslog:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(log.body, "(?i)hwidb|enrollment|crl")'

  # The event Splunk gets, as Cribl sent it: {"message", "severity", "message_type"}, host = switch name (lowercase,
  # NX-OS sends it in capitals). Receive time, as the switch clocks differ.
  transform/syslog:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.attributes["message"], log.body) where log.attributes["message"] == nil
          - set(resource.attributes["host.name"], ConvertCase(log.attributes["host"], "lower")) where log.attributes["host"] != nil
          - set(log.attributes["sev"], Int(log.attributes["pri"]) - (Int(log.attributes["pri"]) / 8) * 8) where log.attributes["pri"] != nil
          - set(log.attributes["severity"], "emergency") where log.attributes["sev"] == 0
          - set(log.attributes["severity"], "alert") where log.attributes["sev"] == 1
          - set(log.attributes["severity"], "critical") where log.attributes["sev"] == 2
          - set(log.attributes["severity"], "error") where log.attributes["sev"] == 3
          - set(log.attributes["severity"], "warning") where log.attributes["sev"] == 4
          - set(log.attributes["severity"], "notice") where log.attributes["sev"] == 5
          - set(log.attributes["severity"], "info") where log.attributes["sev"] == 6
          - set(log.attributes["severity"], "debug") where log.attributes["sev"] == 7
          - keep_keys(log.attributes, ["message", "severity", "message_type"])
          - set(log.body, log.attributes)
          - delete_matching_keys(log.attributes, ".*")
          - set(log.time, log.observed_time)

  # The yang_grpc receiver names a leaf by its path below the subscription xpath, so interface counters from the
  # whole-interface subscription (57003, dialout-iosxe.yaml) arrive as cisco.statistics.in-octets; drop that level
  # so they match the names the filter and the Splunk macros use.
  transform/cisco-names:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - replace_pattern(metric.name, "^cisco\\.statistics\\.", "cisco.")

  # Device dial-out sends ~170 metric names; keep the ones the Splunk dashboards use.
  # cisco.speed also carries oper-status, admin-status and last-change as labels.
  filter/cisco:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^(cisco\\.)?(in-octets|out-octets|in-errors|out-errors|speed|one-minute|used-memory|total-memory|power-allocated|power-budget|power-consumption|consumed-poe-power|available-power|device-name_info|port_info|in-crc-errors|ether-stats\\.in-(oversize|undersize|fragment|jabber)-frames|part-no_info|hardware_info|interface_info|mode_info|openconfig-if-aggregate:aggregate-id_info|interface-mode_info|access-vlan|trunk-vlans_info)$")'
      # The switch's own MACs (port CPU) are not learned addresses.
      datapoint:
        - 'metric.name == "cisco.port_info" and attributes["port"] == "CPU"'
        # Inventory (platform-oper part-no): only the per-member chassis entries (Switch1, Switch2, ...).
        - 'metric.name == "cisco.part-no_info" and not IsMatch(attributes["cname"], "^Switch[0-9]+$")'
        # Interfaces gnmic drops too (drop-if-stats-interfaces in mdt.yaml), plus the IOS-XE internal ones. Port-channels are kept.
        - 'not IsMatch(metric.name, "memory$") and attributes["name"] != nil and IsMatch(attributes["name"], "(?i)^(vlan|loopback|tunnel|app|nve|bluetooth|mgmt|control|virtualportgroup|GigabitEthernet0/0$)")'

  # Same label names as the gnmic data (source, interface_name), and only labels that identify a series:
  # values that change all the time (timestamps, counters as text) would start a new series on every change.
  transform/cisco:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - delete_matching_keys(resource.attributes, "^cisco\\.")
      - context: metric
        statements:
          - copy_metric(name="cisco.last-change") where metric.name == "cisco.speed"
      - context: datapoint
        statements:
          - set(datapoint.attributes["source"], datapoint.attributes["node_id"])
          - set(datapoint.attributes["interface_name"], datapoint.attributes["name"]) where not IsMatch(metric.name, "memory$")
          - set(datapoint.attributes["interface_name"], datapoint.attributes["local-intf-name"]) where metric.name == "cisco.device-name_info"
          - set(datapoint.attributes["pool"], datapoint.attributes["name"]) where IsMatch(metric.name, "memory$")
          - set(datapoint.value_int, UnixSeconds(Time(Substring(datapoint.attributes["last-change"], 0, 19), "%Y-%m-%dT%H:%M:%S"))) where metric.name == "cisco.last-change"
          - keep_keys(datapoint.attributes, ["source", "interface_name"]) where IsMatch(metric.name, "^cisco\\.((in|out)-(octets|errors)|last-change|in-crc-errors|ether-stats\\..*)$")
          - keep_keys(datapoint.attributes, ["source", "interface_name", "oper-status", "admin-status"]) where metric.name == "cisco.speed"
          # Per-port PoE (poe-port-detail entries, keyed by intf-name): the port as interface_name, state and class as labels.
          - set(datapoint.attributes["interface_name"], datapoint.attributes["intf-name"]) where metric.name == "cisco.power-consumption"
          - keep_keys(datapoint.attributes, ["source", "interface_name", "oper-state", "pd-class"]) where metric.name == "cisco.power-consumption"
          # ARP (xe_arp_info, dialout-iosxe.yaml 57009): one metric per leaf, named and labelled like the dial-in
          # mdt_xe_arp_info_* series (arp_oper_address, arp_vrf_vrf, hardware | interface | mode, subscription_name).
          - set(datapoint.attributes["arp_oper_address"], datapoint.attributes["address"]) where IsMatch(metric.name, "^cisco\\.(hardware|interface|mode)_info$")
          - set(datapoint.attributes["arp_vrf_vrf"], datapoint.attributes["vrf"]) where IsMatch(metric.name, "^cisco\\.(hardware|interface|mode)_info$")
          - set(datapoint.attributes["subscription_name"], "xe_arp_info") where IsMatch(metric.name, "^cisco\\.(hardware|interface|mode)_info$")
          - keep_keys(datapoint.attributes, ["source", "arp_oper_address", "arp_vrf_vrf", "subscription_name", "hardware"]) where metric.name == "cisco.hardware_info"
          - keep_keys(datapoint.attributes, ["source", "arp_oper_address", "arp_vrf_vrf", "subscription_name", "interface"]) where metric.name == "cisco.interface_info"
          - keep_keys(datapoint.attributes, ["source", "arp_oper_address", "arp_vrf_vrf", "subscription_name", "mode"]) where metric.name == "cisco.mode_info"
          - keep_keys(datapoint.attributes, ["source", "pool"]) where IsMatch(metric.name, "memory$")
          - keep_keys(datapoint.attributes, ["source"]) where metric.name == "cisco.one-minute"
          - keep_keys(datapoint.attributes, ["source", "power-stack-name", "switch-num"]) where IsMatch(metric.name, "^cisco\\.(power-(allocated|budget)|consumed-poe-power|available-power)")
          - keep_keys(datapoint.attributes, ["source", "interface_name", "device-name", "port-id", "platform-name", "ip-address"]) where metric.name == "cisco.device-name_info"
          # MAC table: no VLAN. yang_grpc keeps only string keys as attributes and never emits keys as metrics, so the
          # numeric vlan-id-number key is lost (receiver v0.154.0, extractKeys). mdt_mac takes the port's VLAN (xe_lag_info).
          - keep_keys(datapoint.attributes, ["source", "mac", "port"]) where metric.name == "cisco.port_info"
          - keep_keys(datapoint.attributes, ["source", "cname", "part-no"]) where metric.name == "cisco.part-no_info"
          # Port-channels (xe_lag_info, dialout-iosxe.yaml 57010-57011): labelled like the dial-in mdt_xe_lag_info_* series.
          # String leaves arrive as the label "value"; access-vlan is the number.
          - set(datapoint.attributes["aggregate_id"], datapoint.attributes["openconfig-if-aggregate:aggregate-id"]) where metric.name == "cisco.openconfig-if-aggregate:aggregate-id_info"
          - set(datapoint.attributes["interface_mode"], datapoint.attributes["value"]) where metric.name == "cisco.interface-mode_info"
          - set(datapoint.attributes["trunk_vlans"], datapoint.attributes["value"]) where metric.name == "cisco.trunk-vlans_info"
          - set(datapoint.attributes["access_vlan"], Format("%d", [Int(datapoint.value_double)])) where metric.name == "cisco.access-vlan"
          - keep_keys(datapoint.attributes, ["source", "interface_name", "aggregate_id"]) where metric.name == "cisco.openconfig-if-aggregate:aggregate-id_info"
          - keep_keys(datapoint.attributes, ["source", "interface_name", "interface_mode"]) where metric.name == "cisco.interface-mode_info"
          - keep_keys(datapoint.attributes, ["source", "interface_name", "trunk_vlans"]) where metric.name == "cisco.trunk-vlans_info"
          - keep_keys(datapoint.attributes, ["source", "interface_name", "access_vlan"]) where metric.name == "cisco.access-vlan"
          # Management IP (Switch Details), like the gnmic event-tags mgmt_ip: the receiver never exposes the sender
          # address, so it is repeated from dialout-iosxe.yaml. On the CPU series only (one per switch, no new series).
          - set(datapoint.attributes["mgmt_ip"], "172.24.80.243") where metric.name == "cisco.one-minute" and datapoint.attributes["source"] == "ibk-lab-sw11"
          - set(datapoint.attributes["mgmt_ip"], "172.24.80.242") where metric.name == "cisco.one-minute" and datapoint.attributes["source"] == "ibk-lab-sw12"
          - set(datapoint.attributes["mgmt_ip"], "172.24.80.241") where metric.name == "cisco.one-minute" and datapoint.attributes["source"] == "ibk-lab-sw13"
          - set(datapoint.attributes["mgmt_ip"], "172.24.80.238") where metric.name == "cisco.one-minute" and datapoint.attributes["source"] == "ibk-lab-seminar"
      # Last: the renames above match on the cisco.* names.
      - context: metric
        statements:
          - set(metric.name, "mdt_xe_arp_info_hardware") where metric.name == "cisco.hardware_info"
          - set(metric.name, "mdt_xe_arp_info_interface") where metric.name == "cisco.interface_info"
          - set(metric.name, "mdt_xe_arp_info_mode") where metric.name == "cisco.mode_info"
          - set(metric.name, "mdt_xe_lag_info_aggregate_id") where metric.name == "cisco.openconfig-if-aggregate:aggregate-id_info"
          - set(metric.name, "mdt_xe_lag_info_interface_mode") where metric.name == "cisco.interface-mode_info"
          - set(metric.name, "mdt_xe_lag_info_trunk_vlans") where metric.name == "cisco.trunk-vlans_info"
          - set(metric.name, "mdt_xe_lag_info_access_vlan") where metric.name == "cisco.access-vlan"

exporters:
  splunk_hec/syslog:
    token: "${env:SPLUNK_HEC_TOKEN}"
    endpoint: "https://172.24.89.194:8088/services/collector"
    tls:
      insecure_skip_verify: true
    source: "otel:syslog"
    sourcetype: "json"
    index: "cisco_syslog"
    profiling_data_enabled: false

  # Device dial-out data for any Prometheus scraper (gnmic dial-in data is on gnmic-output :9273).
  prometheus/devices:
    endpoint: 0.0.0.0:9464

  splunk_hec/splunkfree:
    token: "${env:SPLUNK_HEC_TOKEN}"
    endpoint: "https://172.24.89.194:8088/services/collector"
    tls:
      insecure_skip_verify: true
    source: "otel"
    sourcetype: "otel"
    index: "cisco_metrics"
    profiling_data_enabled: false

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [prometheus/gnmic, hostmetrics]
      processors: [batch]
      exporters: [splunk_hec/splunkfree]
    metrics/test:
      receivers: [yang_grpc]
      processors: [transform/cisco-names, filter/cisco, transform/cisco, batch]
      exporters: [splunk_hec/splunkfree, prometheus/devices]
    logs/syslog:
      receivers: [udp_log/syslog]
      processors: [filter/syslog, transform/syslog, batch]
      exporters: [splunk_hec/syslog]
  extensions: [health_check, pprof, zpages]
