<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>gnmic monitor</title>
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Ccircle%20cx=%2212%22%20cy=%2214%22%20r=%226%22%20fill=%22%2338bdf8%22/%3E%3Ccircle%20cx=%2212%22%20cy=%2232%22%20r=%226%22%20fill=%22%2338bdf8%22/%3E%3Ccircle%20cx=%2212%22%20cy=%2250%22%20r=%226%22%20fill=%22%2338bdf8%22/%3E%3Ccircle%20cx=%2252%22%20cy=%2232%22%20r=%228%22%20fill=%22%2334d399%22/%3E%3Cpath%20d=%22M18%2014%20C34%2014%2036%2032%2044%2032%22%20stroke=%22%2338bdf8%22%20stroke-width=%224%22%20stroke-linecap=%22round%22%20fill=%22none%22/%3E%3Cpath%20d=%22M18%2032%20L44%2032%22%20stroke=%22%2338bdf8%22%20stroke-width=%224%22%20stroke-linecap=%22round%22%20fill=%22none%22/%3E%3Cpath%20d=%22M18%2050%20C34%2050%2036%2032%2044%2032%22%20stroke=%22%2338bdf8%22%20stroke-width=%224%22%20stroke-linecap=%22round%22%20fill=%22none%22/%3E%3C/svg%3E">
	<style>
		:root {
			color-scheme: dark;
			--bg: #0f172a;
			--panel: #1e293b;
			--accent: #38bdf8;
			--muted: #94a3b8;
			--line: #334155;
			--text: #e2e8f0;
			--field: #0b1220;
			--ok: #34d399;
			--warn: #fdba74;
			--error: #f87171;
		}

		@media (prefers-color-scheme: light) {
			:root {
				color-scheme: light;
				--bg: #f1f5f9;
				--panel: #fff;
				--accent: #0369a1;
				--muted: #475569;
				--line: #cbd5e1;
				--text: #172033;
				--field: #fff;
				--ok: #166534;
				--warn: #92400e;
				--error: #b91c1c;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			font-size: 14px;
			background-color: var(--bg);
			color: var(--text);
			line-height: 1.5;
		}

		header {
			background: var(--panel);
			border-bottom: 1px solid var(--line);
			padding: 0 24px;
			display: flex;
			align-items: center;
			gap: 24px;
		}

		header h1 {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 18px;
			margin: 0;
			padding: 16px 0;
			letter-spacing: 0.5px;
			color: var(--text);
		}

		header svg {
			width: 26px;
			height: 26px;
			flex-shrink: 0;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 16px;
		}

		.banner {
			display: none;
			background-color: #b91c1c12;
			border: 1px solid var(--error);
			color: var(--error);
			padding: 12px;
			border-radius: 8px;
			margin-bottom: 16px;
			font-weight: 500;
		}

		.banner.show {
			display: block;
		}

		.top-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			margin-bottom: 24px;
			flex-wrap: wrap;
		}

		.updated {
			font-size: 12px;
			color: var(--fg);
			opacity: 0.7;
			white-space: nowrap;
		}

		.summary {
			margin-bottom: 16px;
			font-size: 13px;
			color: var(--fg);
			opacity: 0.8;
		}

		.table-wrapper {
			overflow-x: auto;
			border: 1px solid var(--line);
			border-radius: 12px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			background-color: var(--bg);
		}

		thead {
			background-color: var(--panel);
			border-bottom: 1px solid var(--line);
		}

		th {
			padding: 12px;
			text-align: left;
			font-weight: 600;
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			color: var(--text);
			background-color: var(--panel);
		}

		tr {
			border-bottom: 1px solid var(--line);
		}

		tr:last-child {
			border-bottom: none;
		}

		td {
			padding: 12px;
			vertical-align: middle;
		}

		tbody tr:hover {
			background-color: var(--field);
			cursor: pointer;
		}

		.expand-icon {
			display: inline-block;
			width: 20px;
			height: 20px;
			text-align: center;
			line-height: 20px;
			user-select: none;
			color: var(--text);
		}

		.target-row.expanded .expand-icon::after {
			content: "▼";
		}

		.target-row:not(.expanded) .expand-icon::after {
			content: "▶";
		}

		.host-row.expanded .expand-icon::after {
			content: "▼";
		}

		.host-row:not(.expanded) .expand-icon::after {
			content: "▶";
		}

		.sub-row {
			display: none;
			background-color: var(--field);
		}

		.target-row.expanded + .sub-row {
			display: table-row;
		}

		.host-sub-row {
			display: table-row;
		}

		.sub-indent {
			padding-left: 36px;
		}

		.badge {
			display: inline-block;
			padding: 2px 8px;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
		}

		.badge.ok {
			background-color: var(--ok);
			color: #ffffff;
		}

		.badge.waiting {
			background-color: var(--muted);
			color: var(--text);
		}

		.badge.stale {
			background-color: var(--warn);
			color: var(--text);
		}

		.badge.no-data {
			background-color: var(--muted);
			color: var(--text);
		}

		.badge.error {
			background-color: var(--error);
			color: #ffffff;
		}

		.badge.level-ok {
			background-color: var(--ok);
			color: #ffffff;
		}

		.badge.level-warn {
			background-color: var(--warn);
			color: var(--text);
		}

		.badge.level-crit {
			background-color: var(--error);
			color: #ffffff;
		}

		.badge.level-unknown {
			background-color: var(--muted);
			color: var(--text);
		}

		.metric-cell {
			position: relative;
		}

		.metric-cell.level-warn {
			color: var(--warn);
		}

		.metric-cell.level-crit {
			color: var(--error);
		}

		.metric-cell.level-unknown {
			color: var(--muted);
		}

		.view-toggle {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
		}

		.view-toggle button {
			padding: 8px 16px;
			border: 1px solid var(--line);
			background-color: var(--panel);
			color: var(--text);
			border-radius: 8px;
			cursor: pointer;
			font-size: 14px;
			font-weight: 500;
			transition: all 0.2s;
		}

		.view-toggle button:hover {
			border-color: var(--accent);
			color: var(--accent);
		}

		.view-toggle button:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}

		.view-toggle button.active {
			background-color: var(--accent);
			color: #ffffff;
			border-color: var(--accent);
		}

		#topologyView {
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 16px;
			background-color: var(--bg);
			position: relative;
		}

		.tooltip {
			position: fixed;
			pointer-events: none;
			z-index: 10;
			background-color: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 8px 12px;
			max-width: 280px;
			color: var(--text);
			font-size: 13px;
		}

		.tooltip > * {
			margin: 0;
			padding: 0;
		}

		.tooltip-line {
			line-height: 1.4;
		}

		.tooltip-line:first-child {
			font-weight: 600;
			margin-bottom: 4px;
		}

		@keyframes highlight {
			0%, 100% {
				background-color: var(--field);
			}
			50% {
				background-color: var(--accent);
				opacity: 0.15;
			}
		}

		tbody tr.highlight {
			animation: highlight 1500ms ease-in-out;
		}

		.node-target {
			cursor: pointer;
		}

		#topologySvg {
			display: block;
			margin-bottom: 16px;
		}

		.legend {
			display: flex;
			gap: 16px;
			flex-wrap: wrap;
			margin-top: 12px;
			font-size: 12px;
			color: var(--text);
		}

		.legend-item {
			display: flex;
			align-items: center;
			gap: 6px;
			color: var(--text);
		}

		.legend-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			flex-shrink: 0;
		}

		.legend-dot.dashed {
			border: 2px dashed var(--muted);
			background: transparent;
		}

		.legend-dot.ok {
			background-color: var(--ok);
		}

		.legend-dot.waiting {
			background-color: var(--muted);
		}

		.legend-dot.stale {
			background-color: var(--warn);
		}

		.legend-dot.no-data {
			background-color: var(--muted);
		}

		.legend-dot.error {
			background-color: var(--error);
		}

		.edge {
			fill: none;
			vector-effect: non-scaling-stroke;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.edge-normal {
			stroke: var(--line);
			stroke-width: 1.5;
		}

		.edge-error {
			stroke: var(--error);
			stroke-width: 2;
		}

		.edge-stale {
			stroke: var(--warn);
			stroke-width: 1.5;
			stroke-dasharray: 4,4;
		}

		.edge-locker {
			stroke: var(--line);
			stroke-width: 1.5;
			stroke-dasharray: 2,2;
		}

		.node {
			cursor: pointer;
		}

		.node circle {
			fill: var(--field);
			stroke-width: 4;
			stroke: var(--line);
		}

		.node-target.st-ok circle { stroke: var(--ok); }
		.node-target.st-waiting circle { stroke: var(--muted); }
		.node-target.st-stale circle { stroke: var(--warn); }
		.node-target.st-no-data circle { stroke: var(--muted); }
		.node-target.st-error circle { stroke: var(--error); }
		.node-target.st-unknown circle { stroke: var(--muted); stroke-dasharray: 2,2; }

		.node-collector.st-ok circle { stroke: var(--ok); }
		.node-collector.st-waiting circle { stroke: var(--muted); }
		.node-collector.st-stale circle { stroke: var(--warn); }
		.node-collector.st-no-data circle { stroke: var(--muted); }
		.node-collector.st-error circle { stroke: var(--error); }
		.node-collector.st-unknown circle { stroke: var(--muted); stroke-dasharray: 2,2; }

		.node-nats.st-ok circle { stroke: var(--ok); }
		.node-nats.st-waiting circle { stroke: var(--muted); }
		.node-nats.st-stale circle { stroke: var(--warn); }
		.node-nats.st-no-data circle { stroke: var(--muted); }
		.node-nats.st-error circle { stroke: var(--error); }
		.node-nats.st-unknown circle { stroke: var(--muted); stroke-dasharray: 2,2; }

		.node-output.st-ok circle { stroke: var(--ok); }
		.node-output.st-waiting circle { stroke: var(--muted); }
		.node-output.st-stale circle { stroke: var(--warn); }
		.node-output.st-no-data circle { stroke: var(--muted); }
		.node-output.st-error circle { stroke: var(--error); }
		.node-output.st-unknown circle { stroke: var(--muted); stroke-dasharray: 2,2; }

		.node-consul.st-ok circle { stroke: var(--ok); }
		.node-consul.st-waiting circle { stroke: var(--muted); }
		.node-consul.st-stale circle { stroke: var(--warn); }
		.node-consul.st-no-data circle { stroke: var(--muted); }
		.node-consul.st-error circle { stroke: var(--error); }
		.node-consul.st-unknown circle { stroke: var(--muted); stroke-dasharray: 2,2; }

		.node-prometheus.st-ok circle { stroke: var(--ok); }
		.node-prometheus.st-waiting circle { stroke: var(--muted); }
		.node-prometheus.st-stale circle { stroke: var(--warn); }
		.node-prometheus.st-no-data circle { stroke: var(--muted); }
		.node-prometheus.st-error circle { stroke: var(--error); }
		.node-prometheus.st-unknown circle { stroke: var(--muted); stroke-dasharray: 2,2; }

		.node-icon {
			stroke: var(--accent);
			fill: none;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.node text {
			font-size: 12px;
			text-anchor: middle;
			fill: var(--text);
			font-weight: 500;
			font-family: ui-monospace, Menlo, monospace;
		}

		.node .label {
			dominant-baseline: hanging;
			fill: var(--text);
		}

		.node .sublabel {
			dominant-baseline: hanging;
			font-weight: 400;
			fill: var(--text);
		}

		svg text {
			fill: var(--text);
		}

		.node:hover circle {
			stroke: var(--accent) !important;
		}

		[hidden] {
			display: none !important;
		}

		a {
			color: var(--accent);
		}

		a:hover {
			text-decoration: underline;
		}

		a:focus-visible, button:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}

		option {
			background-color: var(--panel);
			color: var(--text);
		}

		@media (max-width: 768px) {
			header {
				padding: 0 16px;
			}

			header h1 {
				font-size: 16px;
				padding: 12px 0;
			}

			header svg {
				width: 20px;
				height: 20px;
			}

			.container {
				padding: 16px;
			}

			th, td {
				padding: 8px;
				font-size: 12px;
			}

			.top-bar {
				gap: 8px;
			}

			.view-toggle {
				margin-bottom: 12px;
			}

			.view-toggle button {
				padding: 6px 12px;
				font-size: 12px;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="gnmic monitor" aria-hidden="true"><circle cx="12" cy="14" r="6" fill="#38bdf8"/><circle cx="12" cy="32" r="6" fill="#38bdf8"/><circle cx="12" cy="50" r="6" fill="#38bdf8"/><circle cx="52" cy="32" r="8" fill="#34d399"/><path d="M18 14 C34 14 36 32 44 32" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M18 32 L44 32" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M18 50 C34 50 36 32 44 32" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/></svg>gnmic monitor</h1>
	</header>
	<div class="container">
		<div class="banner" id="errorBanner">Cannot reach monitor API</div>

		<div class="top-bar">
			<div class="updated" id="updated"></div>
		</div>

		<div class="summary" id="summary"></div>

		<div id="hostsPanel" hidden>
			<div class="summary" id="hostsSummary"></div>
			<div class="table-wrapper">
				<table id="hostsTable">
					<thead>
						<tr>
							<th></th>
							<th>Host</th>
							<th>Level</th>
							<th>CPU</th>
							<th>Memory</th>
							<th>Disk (worst)</th>
							<th>Network (worst)</th>
							<th>Reason</th>
						</tr>
					</thead>
					<tbody id="hostsTableBody"></tbody>
				</table>
			</div>
		</div>

		<div class="view-toggle">
			<button type="button" id="btnTopology" data-view="topology" class="active" aria-pressed="true">Topology</button>
			<button type="button" id="btnTable" data-view="table" aria-pressed="false">Table</button>
		</div>

		<div id="topologyView">
			<svg id="topologySvg" role="img" aria-label="Pipeline topology" width="100%"></svg>
			<div id="topologyLegend" class="legend"></div>
			<div id="topologyTooltip" class="tooltip" hidden></div>
		</div>

		<div id="tableView" hidden>
			<div class="table-wrapper">
				<table>
					<thead>
						<tr>
							<th></th>
							<th>Target</th>
							<th>Address</th>
							<th>Owner</th>
							<th>Subscription / Interval</th>
							<th>Last Seen / Events</th>
							<th>Status</th>
							<th>Reason</th>
						</tr>
					</thead>
					<tbody id="targets"></tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="/topology.js"></script>
	<script>
		function currentView() {
			return location.hash === "#table" ? "table" : "topology";
		}

		function showView(name) {
			if (name !== "table" && name !== "topology") {
				name = "topology";
			}

			const newHash = "#" + name;
			if (location.hash !== newHash) {
				location.hash = newHash;
			}

			const topologyView = document.getElementById("topologyView");
			const tableView = document.getElementById("tableView");
			const btnTopology = document.getElementById("btnTopology");
			const btnTable = document.getElementById("btnTable");

			if (name === "table") {
				topologyView.hidden = true;
				tableView.hidden = false;
				btnTable.classList.add("active");
				btnTable.setAttribute("aria-pressed", "true");
				btnTopology.classList.remove("active");
				btnTopology.setAttribute("aria-pressed", "false");
			} else {
				topologyView.hidden = false;
				tableView.hidden = true;
				btnTopology.classList.add("active");
				btnTopology.setAttribute("aria-pressed", "true");
				btnTable.classList.remove("active");
				btnTable.setAttribute("aria-pressed", "false");
			}
		}

		const state = {
			expandedTargets: new Set(),
			expandedHosts: new Set(),
			lastData: null,
			lastSuccessTime: null,
			topology: null,
		};

		const statusSeverity = {
			"OK": 0,
			"WAITING": 1,
			"STALE": 2,
			"NO_DATA": 3,
			"ERROR": 4,
		};

		function formatRelativeTime(date) {
			if (!date) return "never";
			const now = new Date();
			const seconds = Math.floor((now - date) / 1000);

			if (seconds < 60) return `${seconds}s ago`;
			if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
			if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
			return `${Math.floor(seconds / 86400)}d ago`;
		}

		function statusClass(status) {
			return status.toLowerCase().replace(/_/g, "-");
		}

		function renderUpdatedTime() {
			const el = document.getElementById("updated");
			if (state.lastSuccessTime) {
				el.textContent = `Updated ${formatRelativeTime(state.lastSuccessTime)}`;
			}
		}

		function renderSummary(targets) {
			const summary = document.getElementById("summary");
			const counts = {
				total: targets.length,
				OK: 0,
				WAITING: 0,
				STALE: 0,
				NO_DATA: 0,
				ERROR: 0,
			};

			for (const target of targets) {
				counts[target.status]++;
			}

			let text = `${counts.total} targets`;
			const parts = [];
			if (counts.ERROR > 0) parts.push(`${counts.ERROR} ERROR`);
			if (counts.NO_DATA > 0) parts.push(`${counts.NO_DATA} NO_DATA`);
			if (counts.STALE > 0) parts.push(`${counts.STALE} STALE`);
			if (counts.WAITING > 0) parts.push(`${counts.WAITING} WAITING`);
			if (counts.OK > 0) parts.push(`${counts.OK} OK`);

			if (parts.length > 0) {
				text += ": " + parts.join(", ");
			}

			summary.textContent = text;
		}

		function sortTargets(targets) {
			return targets.sort((a, b) => {
				const severityDiff = (statusSeverity[b.status] || 0) - (statusSeverity[a.status] || 0);
				if (severityDiff !== 0) return severityDiff;
				return a.name.localeCompare(b.name);
			});
		}

		const SVG_NS = "http://www.w3.org/2000/svg";

		function iconFor(kind) {
			const g = document.createElementNS(SVG_NS, "g");
			const R = 26;
			const iconSize = 16;
			const iconX = -iconSize / 2;
			const iconY = -iconSize / 2;

			if (kind === "target") {
				// Router: circle with arrows
				const circle = document.createElementNS(SVG_NS, "circle");
				circle.setAttribute("cx", "0");
				circle.setAttribute("cy", "0");
				circle.setAttribute("r", "5");
				circle.setAttribute("class", "node-icon");
				g.appendChild(circle);

				// Four arrows
				const arrows = [
					{ x1: 0, y1: -10, x2: 0, y2: -6 }, // top
					{ x1: 0, y1: 10, x2: 0, y2: 6 },   // bottom
					{ x1: -10, y1: 0, x2: -6, y2: 0 }, // left
					{ x1: 10, y1: 0, x2: 6, y2: 0 }    // right
				];
				for (const arr of arrows) {
					const line = document.createElementNS(SVG_NS, "line");
					line.setAttribute("x1", arr.x1);
					line.setAttribute("y1", arr.y1);
					line.setAttribute("x2", arr.x2);
					line.setAttribute("y2", arr.y2);
					line.setAttribute("class", "node-icon");
					g.appendChild(line);
				}
			} else if (kind === "collector") {
				// Server: rounded rectangle with lines
				const rect = document.createElementNS(SVG_NS, "rect");
				rect.setAttribute("x", "-10");
				rect.setAttribute("y", "-8");
				rect.setAttribute("width", "20");
				rect.setAttribute("height", "16");
				rect.setAttribute("rx", "2");
				rect.setAttribute("class", "node-icon");
				g.appendChild(rect);

				// Two horizontal lines
				for (let y = -4; y <= 4; y += 8) {
					const line = document.createElementNS(SVG_NS, "line");
					line.setAttribute("x1", "-8");
					line.setAttribute("y1", y);
					line.setAttribute("x2", "8");
					line.setAttribute("y2", y);
					line.setAttribute("class", "node-icon");
					g.appendChild(line);
				}
			} else if (kind === "nats") {
				// Message bus: three horizontal bars
				for (let i = 0; i < 3; i++) {
					const y = (i - 1) * 6;
					const line = document.createElementNS(SVG_NS, "line");
					line.setAttribute("x1", "-10");
					line.setAttribute("y1", y);
					line.setAttribute("x2", "10");
					line.setAttribute("y2", y);
					line.setAttribute("stroke-width", 2 - i * 0.5);
					line.setAttribute("class", "node-icon");
					g.appendChild(line);
				}
			} else if (kind === "output") {
				// Database: cylinder
				const top = document.createElementNS(SVG_NS, "ellipse");
				top.setAttribute("cx", "0");
				top.setAttribute("cy", "-6");
				top.setAttribute("rx", "8");
				top.setAttribute("ry", "4");
				top.setAttribute("class", "node-icon");
				g.appendChild(top);

				const left = document.createElementNS(SVG_NS, "line");
				left.setAttribute("x1", "-8");
				left.setAttribute("y1", "-6");
				left.setAttribute("x2", "-8");
				left.setAttribute("y2", "6");
				left.setAttribute("class", "node-icon");
				g.appendChild(left);

				const right = document.createElementNS(SVG_NS, "line");
				right.setAttribute("x1", "8");
				right.setAttribute("y1", "-6");
				right.setAttribute("x2", "8");
				right.setAttribute("y2", "6");
				right.setAttribute("class", "node-icon");
				g.appendChild(right);

				const bottom = document.createElementNS(SVG_NS, "ellipse");
				bottom.setAttribute("cx", "0");
				bottom.setAttribute("cy", "6");
				bottom.setAttribute("rx", "8");
				bottom.setAttribute("ry", "4");
				bottom.setAttribute("class", "node-icon");
				g.appendChild(bottom);
			} else if (kind === "consul") {
				// Hexagon
				const hexPoints = [
					{ x: -8, y: 0 },
					{ x: -4, y: -7 },
					{ x: 4, y: -7 },
					{ x: 8, y: 0 },
					{ x: 4, y: 7 },
					{ x: -4, y: 7 }
				];
				const path = document.createElementNS(SVG_NS, "path");
				const pathStr = hexPoints.map((p, i) => (i === 0 ? "M" : "L") + p.x + "," + p.y).join(" ") + " Z";
				path.setAttribute("d", pathStr);
				path.setAttribute("class", "node-icon");
				g.appendChild(path);
			} else if (kind === "prometheus") {
				// Circle with triangle/flame on top
				const circle = document.createElementNS(SVG_NS, "circle");
				circle.setAttribute("cx", "0");
				circle.setAttribute("cy", "0");
				circle.setAttribute("r", "7");
				circle.setAttribute("class", "node-icon");
				g.appendChild(circle);

				const triangle = document.createElementNS(SVG_NS, "path");
				triangle.setAttribute("d", "M 0,-10 L -3,-5 L 3,-5 Z");
				triangle.setAttribute("class", "node-icon");
				g.appendChild(triangle);
			}

			return g;
		}

		function renderTopology(model) {
			const svg = document.getElementById("topologySvg");
			const legend = document.getElementById("topologyLegend");

			if (!svg || !model || !model.nodes || !model.edges) {
				return;
			}

			state.topology = model;

			// Clear SVG
			while (svg.firstChild) {
				svg.removeChild(svg.firstChild);
			}

			// Clear legend
			legend.innerHTML = "";

			// Set viewBox
			svg.setAttribute("viewBox", "0 0 " + model.width + " " + model.height);

			// Create defs for markers
			const defs = document.createElementNS(SVG_NS, "defs");

			// Create markers for each edge type (smaller arrowheads)
			const markerTypes = [
				{ id: "arrowhead-normal", color: "var(--line)" },
				{ id: "arrowhead-error", color: "var(--error)" },
				{ id: "arrowhead-stale", color: "var(--warn)" }
			];

			for (const markerType of markerTypes) {
				const marker = document.createElementNS(SVG_NS, "marker");
				marker.setAttribute("id", markerType.id);
				marker.setAttribute("markerWidth", "8");
				marker.setAttribute("markerHeight", "8");
				marker.setAttribute("refX", "6");
				marker.setAttribute("refY", "2");
				marker.setAttribute("orient", "auto");
				const poly = document.createElementNS(SVG_NS, "polygon");
				poly.setAttribute("points", "0 0, 6 2, 0 4");
				poly.setAttribute("fill", markerType.color);
				marker.appendChild(poly);
				defs.appendChild(marker);
			}

			svg.appendChild(defs);

			// Draw column headings above first node row
			const headings = [
				{ x: 80, text: "Targets" },
				{ x: 320, text: "Collectors" },
				{ x: 540, text: "NATS" },
				{ x: 720, text: "Output" },
				{ x: 900, text: "Prometheus" }
			];
			for (const h of headings) {
				const text = document.createElementNS(SVG_NS, "text");
				text.setAttribute("x", h.x);
				text.setAttribute("y", "28");
				text.setAttribute("text-anchor", "middle");
				text.setAttribute("font-size", "11");
				text.setAttribute("fill", "var(--muted)");
				text.textContent = h.text;
				svg.appendChild(text);
			}

			// Draw edges first with smooth curves
			for (const edge of model.edges) {
				const fromNode = model.nodes.find(n => n.id === edge.from);
				const toNode = model.nodes.find(n => n.id === edge.to);

				if (!fromNode || !toNode) continue;

				const R = 26;
				const x1 = fromNode.x + R;
				const x2 = toNode.x - R;
				const y1 = fromNode.y;
				const y2 = toNode.y;
				const midX = (x1 + x2) / 2;

				const path = document.createElementNS(SVG_NS, "path");
				// Use cubic Bezier curve with horizontal tangents at both ends (S-curve)
				const pathStr = "M " + x1 + "," + y1 + " C " + midX + "," + y1 + " " + midX + "," + y2 + " " + x2 + "," + y2;
				path.setAttribute("d", pathStr);
				path.setAttribute("class", "edge edge-" + edge.style);

				// Add arrowhead for non-locker edges
				if (edge.style !== "locker") {
					let markerId = "arrowhead-normal";
					if (edge.style === "error") {
						markerId = "arrowhead-error";
					} else if (edge.style === "stale") {
						markerId = "arrowhead-stale";
					}
					path.setAttribute("marker-end", "url(#" + markerId + ")");
				}

				svg.appendChild(path);
			}

			// Draw nodes
			for (const node of model.nodes) {
				try {
					const nodeStatusClass = statusClass(node.status);
					const g = document.createElementNS(SVG_NS, "g");
					g.setAttribute("class", "node node-" + node.kind + " st-" + nodeStatusClass);
					g.setAttribute("data-id", node.id);
					g.setAttribute("transform", "translate(" + node.x + "," + node.y + ")");

					// Circle
					const circle = document.createElementNS(SVG_NS, "circle");
					circle.setAttribute("cx", "0");
					circle.setAttribute("cy", "0");
					circle.setAttribute("r", "26");
					g.appendChild(circle);

					// Icon
					const icon = iconFor(node.kind);
					g.appendChild(icon);

					// Label text
					let label = node.label || "";
					if (node.kind === "target" && label.length > 18) {
						label = label.substring(0, 17) + "…";
					}

					const text = document.createElementNS(SVG_NS, "text");
					text.setAttribute("x", "0");
					text.setAttribute("y", "38");
					text.setAttribute("class", "label");
					text.textContent = label;
					g.appendChild(text);

					// "not monitored" text if needed
					if (node.notMonitored) {
						const subtext = document.createElementNS(SVG_NS, "text");
						subtext.setAttribute("x", "0");
						subtext.setAttribute("y", "52");
						subtext.setAttribute("class", "sublabel");
						subtext.textContent = "not monitored";
						g.appendChild(subtext);
					}

					svg.appendChild(g);
				} catch (e) {
					console.error("Failed to render node " + (node.id || "unknown") + ":", e);
				}
			}

			// Build legend
			const statuses = ["OK", "WAITING", "STALE", "NO_DATA", "ERROR"];
			for (const status of statuses) {
				const item = document.createElement("div");
				item.className = "legend-item";

				const dot = document.createElement("div");
				dot.className = "legend-dot " + statusClass(status);
				item.appendChild(dot);

				const label = document.createElement("span");
				label.textContent = status.replace(/_/g, " ");
				label.style.color = "var(--text)";
				item.appendChild(label);

				legend.appendChild(item);
			}

			// Add "Unknown / Not Monitored" to legend
			const unknownItem = document.createElement("div");
			unknownItem.className = "legend-item";
			const unknownDot = document.createElement("div");
			unknownDot.className = "legend-dot dashed";
			unknownItem.appendChild(unknownDot);
			const unknownLabel = document.createElement("span");
			unknownLabel.textContent = "Unknown / Not Monitored";
			unknownLabel.style.color = "var(--text)";
			unknownItem.appendChild(unknownLabel);
			legend.appendChild(unknownItem);
		}

		function renderTargets(targets) {
			const tbody = document.getElementById("targets");
			tbody.innerHTML = "";

			const sorted = sortTargets([...targets]);

			for (const target of sorted) {
				const targetRow = document.createElement("tr");
				targetRow.className = "target-row";
				targetRow.dataset.name = target.name;
				if (state.expandedTargets.has(target.name)) {
					targetRow.classList.add("expanded");
				}

				const expandCell = document.createElement("td");
				const expandIcon = document.createElement("span");
				expandIcon.className = "expand-icon";
				expandCell.appendChild(expandIcon);

				const nameCell = document.createElement("td");
				nameCell.textContent = target.name;

				const addrCell = document.createElement("td");
				addrCell.textContent = target.address;

				const ownerCell = document.createElement("td");
				ownerCell.textContent = target.owner;

				const statusCell = document.createElement("td");
				const badge = document.createElement("span");
				badge.className = `badge ${statusClass(target.status)}`;
				badge.textContent = target.status;
				statusCell.appendChild(badge);

				const reasonCell = document.createElement("td");
				reasonCell.textContent = target.reason || "";

				targetRow.appendChild(expandCell);
				targetRow.appendChild(nameCell);
				targetRow.appendChild(addrCell);
				targetRow.appendChild(ownerCell);
				// Subscription / Interval and Last Seen / Events have no target-level value
				targetRow.appendChild(document.createElement("td"));
				targetRow.appendChild(document.createElement("td"));
				targetRow.appendChild(statusCell);
				targetRow.appendChild(reasonCell);

				targetRow.addEventListener("click", () => {
					targetRow.classList.toggle("expanded");
					if (targetRow.classList.contains("expanded")) {
						state.expandedTargets.add(target.name);
						// Show all sub-rows for this target
						let nextRow = targetRow.nextSibling;
						while (nextRow) {
							if (!nextRow.classList) {
								nextRow = nextRow.nextSibling;
								continue;
							}
							if (nextRow.classList.contains("target-row")) break;
							if (nextRow.classList.contains("sub-row")) {
								nextRow.style.display = "table-row";
							}
							nextRow = nextRow.nextSibling;
						}
					} else {
						state.expandedTargets.delete(target.name);
						// Hide all sub-rows for this target
						let nextRow = targetRow.nextSibling;
						while (nextRow) {
							if (!nextRow.classList) {
								nextRow = nextRow.nextSibling;
								continue;
							}
							if (nextRow.classList.contains("target-row")) break;
							if (nextRow.classList.contains("sub-row")) {
								nextRow.style.display = "none";
							}
							nextRow = nextRow.nextSibling;
						}
					}
				});

				tbody.appendChild(targetRow);

				// Add sub-rows for subscriptions
				if (target.subs && target.subs.length > 0) {
					for (const sub of target.subs) {
						const subRow = document.createElement("tr");
						subRow.className = "sub-row";

						const emptyCell = document.createElement("td");
						subRow.appendChild(emptyCell);

						const subCell = document.createElement("td");
						subCell.className = "sub-indent";
						subCell.textContent = sub.name;
						subRow.appendChild(subCell);

						const addrCell2 = document.createElement("td");
						subRow.appendChild(addrCell2);

						const ownerCell2 = document.createElement("td");
						subRow.appendChild(ownerCell2);

						const intervalCell = document.createElement("td");
						intervalCell.textContent = sub.interval;
						subRow.appendChild(intervalCell);

						// Last Seen / Events share one column: relative time + event count
						const lastSeenCell = document.createElement("td");
						const lastSeenDate = sub.last_seen ? new Date(sub.last_seen) : null;
						lastSeenCell.textContent = formatRelativeTime(lastSeenDate) + " · " + sub.count;
						if (lastSeenDate) {
							lastSeenCell.title = lastSeenDate.toISOString();
						}
						subRow.appendChild(lastSeenCell);

						const subStatusCell = document.createElement("td");
						const subBadge = document.createElement("span");
						subBadge.className = `badge ${statusClass(sub.status)}`;
						subBadge.textContent = sub.status;
						subStatusCell.appendChild(subBadge);
						subRow.appendChild(subStatusCell);

						const subReasonCell = document.createElement("td");
						subReasonCell.textContent = sub.reason || "";
						subRow.appendChild(subReasonCell);

						tbody.appendChild(subRow);
					}
					// Apply initial visibility state for sub-rows
					if (state.expandedTargets.has(target.name)) {
						let nextRow = targetRow.nextSibling;
						while (nextRow) {
							if (!nextRow.classList) {
								nextRow = nextRow.nextSibling;
								continue;
							}
							if (nextRow.classList.contains("target-row")) break;
							if (nextRow.classList.contains("sub-row")) {
								nextRow.style.display = "table-row";
							}
							nextRow = nextRow.nextSibling;
						}
					}
				}
			}
		}

		function renderHostSubRows(tbody, hostRow, host) {
			// Helper to create disk or NIC sub-row
			function createMetricSubRow(metric, metricType) {
				// Cells line up with the host table: expand, Host, Level, CPU, Memory, Disk, Network, Reason
				const subRow = document.createElement("tr");
				subRow.className = "sub-row host-sub-row";
				const cells = Array.from({ length: 8 }, () => document.createElement("td"));
				subRow.append(...cells);

				cells[1].className = "sub-indent";
				cells[1].textContent = metric.name;

				const levelBadge = document.createElement("span");
				levelBadge.className = `badge level-${metric.level.toLowerCase()}`;
				levelBadge.textContent = metric.level;
				cells[2].appendChild(levelBadge);

				const valueCell = cells[metricType === "disk" ? 5 : 6];
				valueCell.className = `metric-cell level-${metric.level.toLowerCase()}`;
				if (metric.level === "UNKNOWN") {
					valueCell.textContent = "n/a";
				} else {
					valueCell.textContent = metric.value.toFixed(1) + "%";
				}

				cells[7].textContent = metric.detail || "";

				return subRow;
			}

			// Helper to create a container sub-row (CPU and memory only)
			function createContainerSubRow(container) {
				const subRow = document.createElement("tr");
				subRow.className = "sub-row host-sub-row";
				const cells = Array.from({ length: 8 }, () => document.createElement("td"));
				subRow.append(...cells);

				cells[1].className = "sub-indent";
				cells[1].textContent = container.name;

				cells[3].className = "metric-cell";
				cells[3].textContent = container.cpuKnown ? container.cpu.toFixed(1) + "%" : "n/a";

				cells[4].className = "metric-cell";
				cells[4].textContent = formatBytesUI(container.memUsed) +
					(container.memLimitSet ? " (" + container.memPct.toFixed(1) + "%)" : "");

				return subRow;
			}

			function formatBytesUI(bytes) {
				const units = ["B", "KiB", "MiB", "GiB", "TiB"];
				let i = 0;
				while (bytes >= 1024 && i < units.length - 1) {
					bytes /= 1024;
					i++;
				}
				return bytes.toFixed(1) + " " + units[i];
			}

			// Insert after hostRow
			let insertAfter = hostRow;

			// Add disks
			if (host.disks && host.disks.length > 0) {
				for (const disk of host.disks) {
					const subRow = createMetricSubRow(disk, "disk");
					insertAfter.parentNode.insertBefore(subRow, insertAfter.nextSibling);
					insertAfter = subRow;
				}
			}

			// Add NICs
			if (host.nics && host.nics.length > 0) {
				for (const nic of host.nics) {
					const subRow = createMetricSubRow(nic, "nic");
					insertAfter.parentNode.insertBefore(subRow, insertAfter.nextSibling);
					insertAfter = subRow;
				}
			}

			// Add containers
			if (host.containers && host.containers.length > 0) {
				for (const container of host.containers) {
					const subRow = createContainerSubRow(container);
					insertAfter.parentNode.insertBefore(subRow, insertAfter.nextSibling);
					insertAfter = subRow;
				}
			}
		}

		function removeHostSubRows(hostRow) {
			let next = hostRow.nextSibling;
			while (next && next.classList && next.classList.contains("sub-row")) {
				const toRemove = next;
				next = next.nextSibling;
				toRemove.parentNode.removeChild(toRemove);
			}
		}

		function renderHosts(hosts) {
			const panel = document.getElementById("hostsPanel");
			const summary = document.getElementById("hostsSummary");
			const tbody = document.getElementById("hostsTableBody");

			if (!hosts || hosts.length === 0) {
				panel.hidden = true;
				return;
			}

			panel.hidden = false;
			tbody.innerHTML = "";

			// Count levels
			const levelCounts = {
				OK: 0,
				WARN: 0,
				CRIT: 0,
				UNKNOWN: 0,
			};

			for (const host of hosts) {
				levelCounts[host.level]++;
			}

			// Build summary line
			let summaryText = `${hosts.length} hosts`;
			const parts = [];
			if (levelCounts.CRIT > 0) parts.push(`${levelCounts.CRIT} CRIT`);
			if (levelCounts.WARN > 0) parts.push(`${levelCounts.WARN} WARN`);
			if (levelCounts.UNKNOWN > 0) parts.push(`${levelCounts.UNKNOWN} UNKNOWN`);
			if (levelCounts.OK > 0) parts.push(`${levelCounts.OK} OK`);

			if (parts.length > 0) {
				summaryText += ": " + parts.join(", ");
			}

			summary.textContent = summaryText;

			// Render host rows
			for (const host of hosts) {
				const hostRow = document.createElement("tr");
				hostRow.className = "host-row";
				hostRow.dataset.name = host.name;
				if (state.expandedHosts.has(host.name)) {
					hostRow.classList.add("expanded");
				}

				// Expand cell
				const expandCell = document.createElement("td");
				const expandIcon = document.createElement("span");
				expandIcon.className = "expand-icon";
				expandCell.appendChild(expandIcon);

				// Host name cell
				const nameCell = document.createElement("td");
				nameCell.textContent = host.name;

				// Level cell
				const levelCell = document.createElement("td");
				const levelBadge = document.createElement("span");
				levelBadge.className = `badge level-${host.level.toLowerCase()}`;
				levelBadge.textContent = host.level;
				const updatedDate = new Date(host.updated);
				levelBadge.title = updatedDate.toISOString();
				levelCell.appendChild(levelBadge);

				// CPU cell
				const cpuCell = document.createElement("td");
				cpuCell.className = `metric-cell level-${host.cpu.level.toLowerCase()}`;
				if (host.cpu.level === "UNKNOWN") {
					cpuCell.textContent = "n/a";
				} else {
					cpuCell.textContent = host.cpu.value.toFixed(1) + "%";
				}

				// Memory cell
				const memCell = document.createElement("td");
				memCell.className = `metric-cell level-${host.memory.level.toLowerCase()}`;
				if (host.memory.level === "UNKNOWN") {
					memCell.textContent = "n/a";
				} else {
					memCell.textContent = host.memory.value.toFixed(1) + "%";
				}

				// Disk cell
				const diskCell = document.createElement("td");
				diskCell.className = `metric-cell level-${host.disk.level.toLowerCase()}`;
				if (host.disk.level === "UNKNOWN") {
					diskCell.textContent = "n/a";
				} else {
					diskCell.textContent = host.disk.value.toFixed(1) + "% " + host.disk.name;
				}

				// Network cell
				const netCell = document.createElement("td");
				netCell.className = `metric-cell level-${host.network.level.toLowerCase()}`;
				if (host.network.level === "UNKNOWN") {
					netCell.textContent = "n/a";
				} else {
					netCell.textContent = host.network.value.toFixed(1) + "% " + host.network.name;
				}

				// Reason cell
				const reasonCell = document.createElement("td");
				reasonCell.textContent = host.reason || "";

				hostRow.appendChild(expandCell);
				hostRow.appendChild(nameCell);
				hostRow.appendChild(levelCell);
				hostRow.appendChild(cpuCell);
				hostRow.appendChild(memCell);
				hostRow.appendChild(diskCell);
				hostRow.appendChild(netCell);
				hostRow.appendChild(reasonCell);

				hostRow.addEventListener("click", () => {
					hostRow.classList.toggle("expanded");
					if (hostRow.classList.contains("expanded")) {
						state.expandedHosts.add(host.name);
						renderHostSubRows(tbody, hostRow, host);
					} else {
						state.expandedHosts.delete(host.name);
						removeHostSubRows(hostRow);
					}
				});

				tbody.appendChild(hostRow);

				// Add sub-rows if expanded
				if (state.expandedHosts.has(host.name)) {
					renderHostSubRows(tbody, hostRow, host);
				}
			}
		}

		async function fetchStatus() {
			const errorBanner = document.getElementById("errorBanner");
			try {
				const response = await fetch("/api/status");
				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`);
				}
				const data = await response.json();
				state.lastData = data;
				state.lastSuccessTime = new Date();
				errorBanner.classList.remove("show");
				errorBanner.textContent = "Cannot reach monitor API";

				// Render each section with its own error handling
				try {
					renderUpdatedTime();
				} catch (e) {
					console.error("Updated time failed to render:", e);
				}

				try {
					renderSummary(data.targets);
				} catch (e) {
					console.error("Summary failed to render:", e);
				}

				try {
					renderTargets(data.targets);
				} catch (e) {
					console.error("Targets failed to render:", e);
				}

				try {
					renderHosts(data.hosts);
				} catch (e) {
					console.error("Hosts failed to render:", e);
				}

				try {
					if (typeof buildTopology === "function") {
						renderTopology(buildTopology(data));
					}
				} catch (e) {
					console.error("Topology failed to render:", e);
					const topologyView = document.getElementById("topologyView");
					if (topologyView) {
						const errorDiv = document.createElement("div");
						errorDiv.style.color = "var(--error)";
						errorDiv.style.padding = "16px";
						errorDiv.textContent = "Topology failed to render: " + e.message;
						topologyView.innerHTML = "";
						topologyView.appendChild(errorDiv);
					}
				}
			} catch (error) {
				// Only show API banner for fetch/JSON errors
				errorBanner.classList.add("show");
				errorBanner.textContent = "Cannot reach monitor API";
				console.error("API fetch failed:", error);
				if (state.lastData) {
					// Keep showing old data but with error banner
					try {
						renderUpdatedTime();
					} catch (e) {
						console.error("Updated time failed to render:", e);
					}
				}
			}
		}

		// Tooltip and click-through event delegation
		const topologySvg = document.getElementById("topologySvg");
		const topologyTooltip = document.getElementById("topologyTooltip");

		topologySvg.addEventListener("mouseover", (e) => {
			const nodeGroup = e.target.closest("g.node");
			if (!nodeGroup) return;

			const nodeId = nodeGroup.getAttribute("data-id");
			if (!nodeId || !state.topology) return;

			const node = state.topology.nodes.find(n => n.id === nodeId);
			if (!node) return;

			// Clear tooltip
			topologyTooltip.innerHTML = "";

			// Line 1: label (bold)
			const labelLine = document.createElement("div");
			labelLine.className = "tooltip-line";
			const labelBold = document.createElement("strong");
			labelBold.textContent = node.label;
			labelLine.appendChild(labelBold);
			topologyTooltip.appendChild(labelLine);

			// Line 2: Status
			const statusLine = document.createElement("div");
			statusLine.className = "tooltip-line";
			const statusText = node.kind === "prometheus" ? "Not monitored" : node.status;
			statusLine.textContent = "Status: " + statusText;
			topologyTooltip.appendChild(statusLine);

			// Line 3: reason (if not empty)
			if (node.reason) {
				const reasonLine = document.createElement("div");
				reasonLine.className = "tooltip-line";
				reasonLine.textContent = node.reason;
				topologyTooltip.appendChild(reasonLine);
			}

			// Target-specific lines
			if (node.kind === "target") {
				if (node.detail) {
					const addrLine = document.createElement("div");
					addrLine.className = "tooltip-line";
					addrLine.textContent = "Address: " + node.detail;
					topologyTooltip.appendChild(addrLine);
				}
				const lastSeenLine = document.createElement("div");
				lastSeenLine.className = "tooltip-line";
				if (node.lastSeen) {
					const relTime = formatRelativeTime(new Date(node.lastSeen));
					lastSeenLine.textContent = "Last data: " + relTime;
				} else {
					lastSeenLine.textContent = "Last data: never";
				}
				topologyTooltip.appendChild(lastSeenLine);
			} else {
				// Non-target: detail line (if not empty)
				if (node.detail) {
					const detailLine = document.createElement("div");
					detailLine.className = "tooltip-line";
					detailLine.textContent = node.detail;
					topologyTooltip.appendChild(detailLine);
				}
			}

			topologyTooltip.hidden = false;
		});

		topologySvg.addEventListener("mousemove", (e) => {
			if (topologyTooltip.hidden) return;

			// Position tooltip near pointer, offset 12px, clamped to window
			const offsetX = 12;
			const offsetY = 12;
			let x = e.clientX + offsetX;
			let y = e.clientY + offsetY;

			// Clamp to window bounds
			const rect = topologyTooltip.getBoundingClientRect();
			const tooltipWidth = rect.width || 200; // fallback width
			const tooltipHeight = rect.height || 100; // fallback height

			if (x + tooltipWidth > window.innerWidth) {
				x = window.innerWidth - tooltipWidth - 8;
			}
			if (x < 0) {
				x = 8;
			}
			if (y + tooltipHeight > window.innerHeight) {
				y = window.innerHeight - tooltipHeight - 8;
			}
			if (y < 0) {
				y = 8;
			}

			topologyTooltip.style.left = x + "px";
			topologyTooltip.style.top = y + "px";
		});

		topologySvg.addEventListener("mouseout", (e) => {
			const nodeGroup = e.target.closest("g.node");
			if (!nodeGroup) return;
			topologyTooltip.hidden = true;
		});

		topologySvg.addEventListener("click", (e) => {
			const nodeGroup = e.target.closest("g.node");
			if (!nodeGroup) return;

			const nodeId = nodeGroup.getAttribute("data-id");
			if (!nodeId || !state.topology) return;

			const node = state.topology.nodes.find(n => n.id === nodeId);
			if (!node || node.kind !== "target") return;

			// Add to expanded targets
			state.expandedTargets.add(node.target);

			// Switch to table view
			showView("table");

			// Render targets (which will expand this one)
			if (state.lastData) {
				renderTargets(state.lastData.targets);

				// Find and scroll to the target row
				const targetName = node.target;
				let targetRow = null;
				const tbody = document.getElementById("targets");
				for (const row of tbody.querySelectorAll("tr.target-row")) {
					if (row.dataset.name === targetName) {
						targetRow = row;
						break;
					}
				}

				if (targetRow) {
					targetRow.scrollIntoView({ block: "center" });
					targetRow.classList.add("highlight");
					setTimeout(() => {
						targetRow.classList.remove("highlight");
					}, 1500);
				}
			}
		});

		// Wire up view toggle buttons
		document.getElementById("btnTopology").addEventListener("click", () => {
			showView("topology");
		});

		document.getElementById("btnTable").addEventListener("click", () => {
			showView("table");
		});

		// Listen to hash changes
		window.addEventListener("hashchange", () => {
			showView(currentView());
		});

		// Apply current view on load
		showView(currentView());

		// Initial fetch and set up auto-refresh
		fetchStatus();
		setInterval(fetchStatus, 10000);
	</script>
</body>
</html>
