<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>gnmic monitor</title>
	<style>
		:root {
			--bg: #ffffff;
			--fg: #000000;
			--border: #e0e0e0;
			--ok: #4caf50;
			--waiting: #9e9e9e;
			--stale: #ff9800;
			--no-data: #ff9800;
			--error: #f44336;
			--chip-bg: #f5f5f5;
			--banner-bg: #ffebee;
			--banner-fg: #c62828;
			--edge: #708090;
		}

		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) {
				--bg: #121212;
				--fg: #ffffff;
				--border: #333333;
				--ok: #66bb6a;
				--waiting: #bdbdbd;
				--stale: #ffb74d;
				--no-data: #ffb74d;
				--error: #ef5350;
				--chip-bg: #2a2a2a;
				--banner-bg: #5f2c2c;
				--banner-fg: #ffcdd2;
				--edge: #90a4ae;
			}
		}

		:root[data-theme="dark"] {
			--bg: #121212;
			--fg: #ffffff;
			--border: #333333;
			--ok: #66bb6a;
			--waiting: #bdbdbd;
			--stale: #ffb74d;
			--no-data: #ffb74d;
			--error: #ef5350;
			--chip-bg: #2a2a2a;
			--banner-bg: #5f2c2c;
			--banner-fg: #ffcdd2;
			--edge: #90a4ae;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			font-size: 14px;
			background-color: var(--bg);
			color: var(--fg);
			line-height: 1.5;
		}

		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 16px;
		}

		.banner {
			display: none;
			background-color: var(--banner-bg);
			color: var(--banner-fg);
			padding: 12px;
			border-radius: 4px;
			margin-bottom: 16px;
			font-weight: 500;
		}

		.banner.show {
			display: block;
		}

		.top-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			margin-bottom: 24px;
			flex-wrap: wrap;
		}

		.components {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
		}

		.chip {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 8px 12px;
			border-radius: 16px;
			background-color: var(--chip-bg);
			border: 1px solid var(--border);
			font-size: 12px;
			font-weight: 500;
		}

		.chip-status {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			flex-shrink: 0;
		}

		.chip-status.ok {
			background-color: var(--ok);
		}

		.chip-status.error {
			background-color: var(--error);
		}

		.chip-detail {
			font-size: 11px;
			color: var(--fg);
			opacity: 0.7;
			max-width: 100px;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.updated {
			font-size: 12px;
			color: var(--fg);
			opacity: 0.7;
			white-space: nowrap;
		}

		.summary {
			margin-bottom: 16px;
			font-size: 13px;
			color: var(--fg);
			opacity: 0.8;
		}

		.table-wrapper {
			overflow-x: auto;
			border: 1px solid var(--border);
			border-radius: 4px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			background-color: var(--bg);
		}

		thead {
			background-color: var(--chip-bg);
			border-bottom: 2px solid var(--border);
		}

		th {
			padding: 12px;
			text-align: left;
			font-weight: 600;
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		tr {
			border-bottom: 1px solid var(--border);
		}

		tr:last-child {
			border-bottom: none;
		}

		td {
			padding: 12px;
			vertical-align: middle;
		}

		tbody tr:hover {
			background-color: var(--chip-bg);
			cursor: pointer;
		}

		.expand-icon {
			display: inline-block;
			width: 20px;
			height: 20px;
			text-align: center;
			line-height: 20px;
			user-select: none;
			color: var(--fg);
		}

		.target-row.expanded .expand-icon::after {
			content: "▼";
		}

		.target-row:not(.expanded) .expand-icon::after {
			content: "▶";
		}

		.sub-row {
			display: none;
			background-color: var(--chip-bg);
		}

		.target-row.expanded + .sub-row {
			display: table-row;
		}

		.sub-indent {
			padding-left: 36px;
		}

		.badge {
			display: inline-block;
			padding: 4px 8px;
			border-radius: 3px;
			font-size: 12px;
			font-weight: 600;
			color: #ffffff;
			text-transform: uppercase;
		}

		.badge.ok {
			background-color: var(--ok);
		}

		.badge.waiting {
			background-color: var(--waiting);
			color: #000000;
		}

		.badge.stale {
			background-color: var(--stale);
			color: #000000;
		}

		.badge.no-data {
			background-color: var(--no-data);
			color: #000000;
		}

		.badge.error {
			background-color: var(--error);
		}

		.view-toggle {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
		}

		.view-toggle button {
			padding: 8px 16px;
			border: 1px solid var(--border);
			background-color: var(--chip-bg);
			color: var(--fg);
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
			font-weight: 500;
			transition: all 0.2s;
		}

		.view-toggle button:hover {
			background-color: var(--border);
		}

		.view-toggle button.active {
			background-color: var(--fg);
			color: var(--bg);
			border-color: var(--fg);
		}

		#topologyView {
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 16px;
			background-color: var(--bg);
			position: relative;
		}

		.tooltip {
			position: fixed;
			pointer-events: none;
			z-index: 10;
			background-color: var(--chip-bg);
			border: 1px solid var(--border);
			border-radius: 4px;
			padding: 8px 12px;
			max-width: 280px;
			color: var(--fg);
			font-size: 13px;
		}

		.tooltip > * {
			margin: 0;
			padding: 0;
		}

		.tooltip-line {
			line-height: 1.4;
		}

		.tooltip-line:first-child {
			font-weight: 600;
			margin-bottom: 4px;
		}

		@keyframes highlight {
			0%, 100% {
				background-color: var(--chip-bg);
			}
			50% {
				background-color: var(--stale);
				opacity: 0.3;
			}
		}

		tbody tr.highlight {
			animation: highlight 1500ms ease-in-out;
		}

		.node-target {
			cursor: pointer;
		}

		#topologySvg {
			display: block;
			margin-bottom: 16px;
		}

		.legend {
			display: flex;
			gap: 16px;
			flex-wrap: wrap;
			margin-top: 12px;
			font-size: 12px;
		}

		.legend-item {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.legend-dot {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			flex-shrink: 0;
		}

		.legend-dot.dashed {
			border: 2px dashed var(--waiting);
			background: transparent;
		}

		.edge {
			fill: none;
			vector-effect: non-scaling-stroke;
		}

		.edge-normal {
			stroke: var(--edge);
			stroke-width: 2;
		}

		.edge-error {
			stroke: var(--error);
			stroke-width: 3;
		}

		.edge-stale {
			stroke: var(--stale);
			stroke-width: 2;
			stroke-dasharray: 4,4;
		}

		.edge-locker {
			stroke: var(--edge);
			stroke-width: 2;
			stroke-dasharray: 2,2;
		}

		.node {
			cursor: pointer;
		}

		.node circle {
			fill: var(--chip-bg);
			stroke-width: 4;
		}

		.node-target.st-ok circle { stroke: var(--ok); }
		.node-target.st-waiting circle { stroke: var(--waiting); }
		.node-target.st-stale circle { stroke: var(--stale); }
		.node-target.st-no-data circle { stroke: var(--no-data); }
		.node-target.st-error circle { stroke: var(--error); }
		.node-target.st-unknown circle { stroke: var(--waiting); stroke-dasharray: 2,2; }

		.node-collector.st-ok circle { stroke: var(--ok); }
		.node-collector.st-waiting circle { stroke: var(--waiting); }
		.node-collector.st-stale circle { stroke: var(--stale); }
		.node-collector.st-no-data circle { stroke: var(--no-data); }
		.node-collector.st-error circle { stroke: var(--error); }
		.node-collector.st-unknown circle { stroke: var(--waiting); stroke-dasharray: 2,2; }

		.node-nats.st-ok circle { stroke: var(--ok); }
		.node-nats.st-waiting circle { stroke: var(--waiting); }
		.node-nats.st-stale circle { stroke: var(--stale); }
		.node-nats.st-no-data circle { stroke: var(--no-data); }
		.node-nats.st-error circle { stroke: var(--error); }
		.node-nats.st-unknown circle { stroke: var(--waiting); stroke-dasharray: 2,2; }

		.node-output.st-ok circle { stroke: var(--ok); }
		.node-output.st-waiting circle { stroke: var(--waiting); }
		.node-output.st-stale circle { stroke: var(--stale); }
		.node-output.st-no-data circle { stroke: var(--no-data); }
		.node-output.st-error circle { stroke: var(--error); }
		.node-output.st-unknown circle { stroke: var(--waiting); stroke-dasharray: 2,2; }

		.node-consul.st-ok circle { stroke: var(--ok); }
		.node-consul.st-waiting circle { stroke: var(--waiting); }
		.node-consul.st-stale circle { stroke: var(--stale); }
		.node-consul.st-no-data circle { stroke: var(--no-data); }
		.node-consul.st-error circle { stroke: var(--error); }
		.node-consul.st-unknown circle { stroke: var(--waiting); stroke-dasharray: 2,2; }

		.node-prometheus.st-ok circle { stroke: var(--ok); }
		.node-prometheus.st-waiting circle { stroke: var(--waiting); }
		.node-prometheus.st-stale circle { stroke: var(--stale); }
		.node-prometheus.st-no-data circle { stroke: var(--no-data); }
		.node-prometheus.st-error circle { stroke: var(--error); }
		.node-prometheus.st-unknown circle { stroke: var(--waiting); stroke-dasharray: 2,2; }

		.node-icon {
			stroke: var(--fg);
			fill: none;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.node text {
			font-size: 12px;
			text-anchor: middle;
			fill: var(--fg);
			font-weight: 500;
		}

		.node .label { dominant-baseline: hanging; }
		.node .sublabel { dominant-baseline: hanging; font-weight: 400; }

		[hidden] {
			display: none !important;
		}

		@media (max-width: 768px) {
			.container {
				padding: 8px;
			}

			th, td {
				padding: 8px;
				font-size: 12px;
			}

			.chip {
				padding: 6px 10px;
				font-size: 11px;
			}

			.top-bar {
				gap: 8px;
			}

			.view-toggle {
				margin-bottom: 12px;
			}

			.view-toggle button {
				padding: 6px 12px;
				font-size: 12px;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="banner" id="errorBanner">Cannot reach monitor API</div>

		<div class="top-bar">
			<div class="components" id="components"></div>
			<div class="updated" id="updated"></div>
		</div>

		<div class="summary" id="summary"></div>

		<div class="view-toggle">
			<button type="button" id="btnTopology" data-view="topology" class="active" aria-pressed="true">Topology</button>
			<button type="button" id="btnTable" data-view="table" aria-pressed="false">Table</button>
		</div>

		<div id="topologyView">
			<svg id="topologySvg" role="img" aria-label="Pipeline topology" width="100%"></svg>
			<div id="topologyLegend" class="legend"></div>
			<div id="topologyTooltip" class="tooltip" hidden></div>
		</div>

		<div id="tableView" hidden>
			<div class="table-wrapper">
				<table>
					<thead>
						<tr>
							<th></th>
							<th>Target</th>
							<th>Address</th>
							<th>Owner</th>
							<th>Status</th>
							<th>Reason</th>
						</tr>
					</thead>
					<tbody id="targets"></tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="/topology.js"></script>
	<script>
		function currentView() {
			return location.hash === "#table" ? "table" : "topology";
		}

		function showView(name) {
			if (name !== "table" && name !== "topology") {
				name = "topology";
			}

			const newHash = "#" + name;
			if (location.hash !== newHash) {
				location.hash = newHash;
			}

			const topologyView = document.getElementById("topologyView");
			const tableView = document.getElementById("tableView");
			const btnTopology = document.getElementById("btnTopology");
			const btnTable = document.getElementById("btnTable");

			if (name === "table") {
				topologyView.hidden = true;
				tableView.hidden = false;
				btnTable.classList.add("active");
				btnTable.setAttribute("aria-pressed", "true");
				btnTopology.classList.remove("active");
				btnTopology.setAttribute("aria-pressed", "false");
			} else {
				topologyView.hidden = false;
				tableView.hidden = true;
				btnTopology.classList.add("active");
				btnTopology.setAttribute("aria-pressed", "true");
				btnTable.classList.remove("active");
				btnTable.setAttribute("aria-pressed", "false");
			}
		}

		const state = {
			expandedTargets: new Set(),
			lastData: null,
			lastSuccessTime: null,
			topology: null,
		};

		const statusSeverity = {
			"OK": 0,
			"WAITING": 1,
			"STALE": 2,
			"NO_DATA": 3,
			"ERROR": 4,
		};

		function formatRelativeTime(date) {
			if (!date) return "never";
			const now = new Date();
			const seconds = Math.floor((now - date) / 1000);

			if (seconds < 60) return `${seconds}s ago`;
			if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
			if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
			return `${Math.floor(seconds / 86400)}d ago`;
		}

		function statusClass(status) {
			return status.toLowerCase().replace(/_/g, "-");
		}

		function renderComponents(components) {
			const container = document.getElementById("components");
			container.innerHTML = "";

			for (const comp of components) {
				const chip = document.createElement("div");
				chip.className = "chip";
				chip.title = comp.detail;

				const status = document.createElement("div");
				status.className = `chip-status ${comp.ok ? "ok" : "error"}`;

				const name = document.createElement("span");
				name.textContent = comp.name;

				const detail = document.createElement("div");
				detail.className = "chip-detail";
				detail.textContent = comp.detail;

				chip.appendChild(status);
				chip.appendChild(name);
				chip.appendChild(detail);
				container.appendChild(chip);
			}
		}

		function renderUpdatedTime() {
			const el = document.getElementById("updated");
			if (state.lastSuccessTime) {
				el.textContent = `Updated ${formatRelativeTime(state.lastSuccessTime)}`;
			}
		}

		function renderSummary(targets) {
			const summary = document.getElementById("summary");
			const counts = {
				total: targets.length,
				OK: 0,
				WAITING: 0,
				STALE: 0,
				NO_DATA: 0,
				ERROR: 0,
			};

			for (const target of targets) {
				counts[target.status]++;
			}

			let text = `${counts.total} targets`;
			const parts = [];
			if (counts.ERROR > 0) parts.push(`${counts.ERROR} ERROR`);
			if (counts.NO_DATA > 0) parts.push(`${counts.NO_DATA} NO_DATA`);
			if (counts.STALE > 0) parts.push(`${counts.STALE} STALE`);
			if (counts.WAITING > 0) parts.push(`${counts.WAITING} WAITING`);
			if (counts.OK > 0) parts.push(`${counts.OK} OK`);

			if (parts.length > 0) {
				text += ": " + parts.join(", ");
			}

			summary.textContent = text;
		}

		function sortTargets(targets) {
			return targets.sort((a, b) => {
				const severityDiff = (statusSeverity[b.status] || 0) - (statusSeverity[a.status] || 0);
				if (severityDiff !== 0) return severityDiff;
				return a.name.localeCompare(b.name);
			});
		}

		const SVG_NS = "http://www.w3.org/2000/svg";

		function iconFor(kind) {
			const g = document.createElementNS(SVG_NS, "g");
			const R = 26;
			const iconSize = 16;
			const iconX = -iconSize / 2;
			const iconY = -iconSize / 2;

			if (kind === "target") {
				// Router: circle with arrows
				const circle = document.createElementNS(SVG_NS, "circle");
				circle.setAttribute("cx", "0");
				circle.setAttribute("cy", "0");
				circle.setAttribute("r", "5");
				circle.setAttribute("class", "node-icon");
				g.appendChild(circle);

				// Four arrows
				const arrows = [
					{ x1: 0, y1: -10, x2: 0, y2: -6 }, // top
					{ x1: 0, y1: 10, x2: 0, y2: 6 },   // bottom
					{ x1: -10, y1: 0, x2: -6, y2: 0 }, // left
					{ x1: 10, y1: 0, x2: 6, y2: 0 }    // right
				];
				for (const arr of arrows) {
					const line = document.createElementNS(SVG_NS, "line");
					line.setAttribute("x1", arr.x1);
					line.setAttribute("y1", arr.y1);
					line.setAttribute("x2", arr.x2);
					line.setAttribute("y2", arr.y2);
					line.setAttribute("class", "node-icon");
					g.appendChild(line);
				}
			} else if (kind === "collector") {
				// Server: rounded rectangle with lines
				const rect = document.createElementNS(SVG_NS, "rect");
				rect.setAttribute("x", "-10");
				rect.setAttribute("y", "-8");
				rect.setAttribute("width", "20");
				rect.setAttribute("height", "16");
				rect.setAttribute("rx", "2");
				rect.setAttribute("class", "node-icon");
				g.appendChild(rect);

				// Two horizontal lines
				for (let y = -4; y <= 4; y += 8) {
					const line = document.createElementNS(SVG_NS, "line");
					line.setAttribute("x1", "-8");
					line.setAttribute("y1", y);
					line.setAttribute("x2", "8");
					line.setAttribute("y2", y);
					line.setAttribute("class", "node-icon");
					g.appendChild(line);
				}
			} else if (kind === "nats") {
				// Message bus: three horizontal bars
				for (let i = 0; i < 3; i++) {
					const y = (i - 1) * 6;
					const line = document.createElementNS(SVG_NS, "line");
					line.setAttribute("x1", "-10");
					line.setAttribute("y1", y);
					line.setAttribute("x2", "10");
					line.setAttribute("y2", y);
					line.setAttribute("stroke-width", 2 - i * 0.5);
					line.setAttribute("class", "node-icon");
					g.appendChild(line);
				}
			} else if (kind === "output") {
				// Database: cylinder
				const top = document.createElementNS(SVG_NS, "ellipse");
				top.setAttribute("cx", "0");
				top.setAttribute("cy", "-6");
				top.setAttribute("rx", "8");
				top.setAttribute("ry", "4");
				top.setAttribute("class", "node-icon");
				g.appendChild(top);

				const left = document.createElementNS(SVG_NS, "line");
				left.setAttribute("x1", "-8");
				left.setAttribute("y1", "-6");
				left.setAttribute("x2", "-8");
				left.setAttribute("y2", "6");
				left.setAttribute("class", "node-icon");
				g.appendChild(left);

				const right = document.createElementNS(SVG_NS, "line");
				right.setAttribute("x1", "8");
				right.setAttribute("y1", "-6");
				right.setAttribute("x2", "8");
				right.setAttribute("y2", "6");
				right.setAttribute("class", "node-icon");
				g.appendChild(right);

				const bottom = document.createElementNS(SVG_NS, "ellipse");
				bottom.setAttribute("cx", "0");
				bottom.setAttribute("cy", "6");
				bottom.setAttribute("rx", "8");
				bottom.setAttribute("ry", "4");
				bottom.setAttribute("class", "node-icon");
				g.appendChild(bottom);
			} else if (kind === "consul") {
				// Hexagon
				const hexPoints = [
					{ x: -8, y: 0 },
					{ x: -4, y: -7 },
					{ x: 4, y: -7 },
					{ x: 8, y: 0 },
					{ x: 4, y: 7 },
					{ x: -4, y: 7 }
				];
				const path = document.createElementNS(SVG_NS, "path");
				const pathStr = hexPoints.map((p, i) => (i === 0 ? "M" : "L") + p.x + "," + p.y).join(" ") + " Z";
				path.setAttribute("d", pathStr);
				path.setAttribute("class", "node-icon");
				g.appendChild(path);
			} else if (kind === "prometheus") {
				// Circle with triangle/flame on top
				const circle = document.createElementNS(SVG_NS, "circle");
				circle.setAttribute("cx", "0");
				circle.setAttribute("cy", "0");
				circle.setAttribute("r", "7");
				circle.setAttribute("class", "node-icon");
				g.appendChild(circle);

				const triangle = document.createElementNS(SVG_NS, "path");
				triangle.setAttribute("d", "M 0,-10 L -3,-5 L 3,-5 Z");
				triangle.setAttribute("class", "node-icon");
				g.appendChild(triangle);
			}

			return g;
		}

		function renderTopology(model) {
			const svg = document.getElementById("topologySvg");
			const legend = document.getElementById("topologyLegend");

			if (!svg || !model || !model.nodes || !model.edges) {
				return;
			}

			state.topology = model;

			// Clear SVG
			while (svg.firstChild) {
				svg.removeChild(svg.firstChild);
			}

			// Clear legend
			legend.innerHTML = "";

			// Set viewBox
			svg.setAttribute("viewBox", "0 0 " + model.width + " " + model.height);

			// Create defs for markers
			const defs = document.createElementNS(SVG_NS, "defs");
			const marker = document.createElementNS(SVG_NS, "marker");
			marker.setAttribute("id", "arrowhead");
			marker.setAttribute("markerWidth", "10");
			marker.setAttribute("markerHeight", "10");
			marker.setAttribute("refX", "9");
			marker.setAttribute("refY", "3");
			marker.setAttribute("orient", "auto");
			const poly = document.createElementNS(SVG_NS, "polygon");
			poly.setAttribute("points", "0 0, 10 3, 0 6");
			poly.setAttribute("fill", "var(--edge)");
			marker.appendChild(poly);
			defs.appendChild(marker);
			svg.appendChild(defs);

			// Draw column headings
			const headings = [
				{ x: 80, text: "Targets" },
				{ x: 320, text: "Collectors" },
				{ x: 540, text: "NATS" },
				{ x: 720, text: "Output" },
				{ x: 900, text: "Prometheus" }
			];
			for (const h of headings) {
				const text = document.createElementNS(SVG_NS, "text");
				text.setAttribute("x", h.x);
				text.setAttribute("y", "20");
				text.setAttribute("text-anchor", "middle");
				text.setAttribute("font-size", "11");
				text.setAttribute("fill", "var(--fg)");
				text.setAttribute("opacity", "0.6");
				text.textContent = h.text;
				svg.appendChild(text);
			}

			// Draw edges first
			for (const edge of model.edges) {
				const fromNode = model.nodes.find(n => n.id === edge.from);
				const toNode = model.nodes.find(n => n.id === edge.to);

				if (!fromNode || !toNode) continue;

				const R = 26;
				const x1 = fromNode.x + R;
				const x2 = toNode.x - R;
				const y1 = fromNode.y;
				const y2 = toNode.y;
				const midX = (x1 + x2) / 2;

				const path = document.createElementNS(SVG_NS, "path");
				const pathStr = "M " + x1 + "," + y1 + " H " + midX + " V " + y2 + " H " + x2;
				path.setAttribute("d", pathStr);
				path.setAttribute("class", "edge edge-" + edge.style);

				// Add arrowhead for non-locker edges
				if (edge.style !== "locker") {
					path.setAttribute("marker-end", "url(#arrowhead)");
				}

				svg.appendChild(path);
			}

			// Draw nodes
			for (const node of model.nodes) {
				const statusClass = statusClass(node.status);
				const g = document.createElementNS(SVG_NS, "g");
				g.setAttribute("class", "node node-" + node.kind + " st-" + statusClass);
				g.setAttribute("data-id", node.id);
				g.setAttribute("transform", "translate(" + node.x + "," + node.y + ")");

				// Circle
				const circle = document.createElementNS(SVG_NS, "circle");
				circle.setAttribute("cx", "0");
				circle.setAttribute("cy", "0");
				circle.setAttribute("r", "26");
				g.appendChild(circle);

				// Icon
				const icon = iconFor(node.kind);
				g.appendChild(icon);

				// Label text
				let label = node.label;
				if (node.kind === "target" && label.length > 18) {
					label = label.substring(0, 17) + "…";
				}

				const text = document.createElementNS(SVG_NS, "text");
				text.setAttribute("x", "0");
				text.setAttribute("y", "38");
				text.setAttribute("class", "label");
				text.textContent = label;
				g.appendChild(text);

				// "not monitored" text if needed
				if (node.notMonitored) {
					const subtext = document.createElementNS(SVG_NS, "text");
					subtext.setAttribute("x", "0");
					subtext.setAttribute("y", "52");
					subtext.setAttribute("class", "sublabel");
					subtext.textContent = "not monitored";
					g.appendChild(subtext);
				}

				svg.appendChild(g);
			}

			// Build legend
			const statuses = ["OK", "WAITING", "STALE", "NO_DATA", "ERROR"];
			for (const status of statuses) {
				const item = document.createElement("div");
				item.className = "legend-item";

				const dot = document.createElement("div");
				dot.className = "legend-dot " + statusClass(status);
				const colorVar = status === "NO_DATA" ? "--no-data" : "--" + status.toLowerCase();
				dot.style.backgroundColor = "var(" + colorVar + ")";
				item.appendChild(dot);

				const label = document.createElement("span");
				label.textContent = status.replace(/_/g, " ");
				item.appendChild(label);

				legend.appendChild(item);
			}

			// Add "Unknown / Not Monitored" to legend
			const unknownItem = document.createElement("div");
			unknownItem.className = "legend-item";
			const unknownDot = document.createElement("div");
			unknownDot.className = "legend-dot dashed";
			unknownItem.appendChild(unknownDot);
			const unknownLabel = document.createElement("span");
			unknownLabel.textContent = "Unknown / Not Monitored";
			unknownItem.appendChild(unknownLabel);
			legend.appendChild(unknownItem);
		}

		function renderTargets(targets) {
			const tbody = document.getElementById("targets");
			tbody.innerHTML = "";

			const sorted = sortTargets([...targets]);

			for (const target of sorted) {
				const targetRow = document.createElement("tr");
				targetRow.className = "target-row";
				targetRow.dataset.name = target.name;
				if (state.expandedTargets.has(target.name)) {
					targetRow.classList.add("expanded");
				}

				const expandCell = document.createElement("td");
				const expandIcon = document.createElement("span");
				expandIcon.className = "expand-icon";
				expandCell.appendChild(expandIcon);

				const nameCell = document.createElement("td");
				nameCell.textContent = target.name;

				const addrCell = document.createElement("td");
				addrCell.textContent = target.address;

				const ownerCell = document.createElement("td");
				ownerCell.textContent = target.owner;

				const statusCell = document.createElement("td");
				const badge = document.createElement("span");
				badge.className = `badge ${statusClass(target.status)}`;
				badge.textContent = target.status;
				statusCell.appendChild(badge);

				const reasonCell = document.createElement("td");
				reasonCell.textContent = target.reason || "";

				targetRow.appendChild(expandCell);
				targetRow.appendChild(nameCell);
				targetRow.appendChild(addrCell);
				targetRow.appendChild(ownerCell);
				targetRow.appendChild(statusCell);
				targetRow.appendChild(reasonCell);

				targetRow.addEventListener("click", () => {
					targetRow.classList.toggle("expanded");
					if (targetRow.classList.contains("expanded")) {
						state.expandedTargets.add(target.name);
					} else {
						state.expandedTargets.delete(target.name);
					}
				});

				tbody.appendChild(targetRow);

				// Add sub-rows for subscriptions
				if (target.subs && target.subs.length > 0) {
					for (const sub of target.subs) {
						const subRow = document.createElement("tr");
						subRow.className = "sub-row";

						const emptyCell = document.createElement("td");
						subRow.appendChild(emptyCell);

						const subCell = document.createElement("td");
						subCell.className = "sub-indent";
						subCell.textContent = sub.name;
						subRow.appendChild(subCell);

						const addrCell2 = document.createElement("td");
						subRow.appendChild(addrCell2);

						const ownerCell2 = document.createElement("td");
						subRow.appendChild(ownerCell2);

						const intervalCell = document.createElement("td");
						intervalCell.textContent = sub.interval;
						subRow.appendChild(intervalCell);

						const lastSeenCell = document.createElement("td");
						const lastSeenDate = sub.last_seen ? new Date(sub.last_seen) : null;
						lastSeenCell.textContent = formatRelativeTime(lastSeenDate);
						if (lastSeenDate) {
							lastSeenCell.title = lastSeenDate.toISOString();
						}
						// Insert before the Status column, so we need to rearrange
						subRow.appendChild(lastSeenCell);

						const eventsCell = document.createElement("td");
						eventsCell.textContent = sub.count;
						subRow.appendChild(eventsCell);

						const subStatusCell = document.createElement("td");
						const subBadge = document.createElement("span");
						subBadge.className = `badge ${statusClass(sub.status)}`;
						subBadge.textContent = sub.status;
						subStatusCell.appendChild(subBadge);
						subRow.appendChild(subStatusCell);

						const subReasonCell = document.createElement("td");
						subReasonCell.textContent = sub.reason || "";
						subRow.appendChild(subReasonCell);

						tbody.appendChild(subRow);
					}
				}
			}
		}

		async function fetchStatus() {
			try {
				const response = await fetch("/api/status");
				if (!response.ok) {
					throw new Error(`HTTP ${response.status}`);
				}
				const data = await response.json();
				state.lastData = data;
				state.lastSuccessTime = new Date();
				document.getElementById("errorBanner").classList.remove("show");

				renderComponents(data.components);
				renderUpdatedTime();
				renderSummary(data.targets);
				renderTargets(data.targets);
				if (typeof buildTopology === "function") {
					renderTopology(buildTopology(data));
				}
			} catch (error) {
				document.getElementById("errorBanner").classList.add("show");
				if (state.lastData) {
					// Keep showing old data but with error banner
					renderUpdatedTime();
				}
			}
		}

		// Tooltip and click-through event delegation
		const topologySvg = document.getElementById("topologySvg");
		const topologyTooltip = document.getElementById("topologyTooltip");

		topologySvg.addEventListener("mouseover", (e) => {
			const nodeGroup = e.target.closest("g.node");
			if (!nodeGroup) return;

			const nodeId = nodeGroup.getAttribute("data-id");
			if (!nodeId || !state.topology) return;

			const node = state.topology.nodes.find(n => n.id === nodeId);
			if (!node) return;

			// Clear tooltip
			topologyTooltip.innerHTML = "";

			// Line 1: label (bold)
			const labelLine = document.createElement("div");
			labelLine.className = "tooltip-line";
			const labelBold = document.createElement("strong");
			labelBold.textContent = node.label;
			labelLine.appendChild(labelBold);
			topologyTooltip.appendChild(labelLine);

			// Line 2: Status
			const statusLine = document.createElement("div");
			statusLine.className = "tooltip-line";
			const statusText = node.kind === "prometheus" ? "Not monitored" : node.status;
			statusLine.textContent = "Status: " + statusText;
			topologyTooltip.appendChild(statusLine);

			// Line 3: reason (if not empty)
			if (node.reason) {
				const reasonLine = document.createElement("div");
				reasonLine.className = "tooltip-line";
				reasonLine.textContent = node.reason;
				topologyTooltip.appendChild(reasonLine);
			}

			// Target-specific lines
			if (node.kind === "target") {
				if (node.detail) {
					const addrLine = document.createElement("div");
					addrLine.className = "tooltip-line";
					addrLine.textContent = "Address: " + node.detail;
					topologyTooltip.appendChild(addrLine);
				}
				const lastSeenLine = document.createElement("div");
				lastSeenLine.className = "tooltip-line";
				if (node.lastSeen) {
					const relTime = formatRelativeTime(new Date(node.lastSeen));
					lastSeenLine.textContent = "Last data: " + relTime;
				} else {
					lastSeenLine.textContent = "Last data: never";
				}
				topologyTooltip.appendChild(lastSeenLine);
			} else {
				// Non-target: detail line (if not empty)
				if (node.detail) {
					const detailLine = document.createElement("div");
					detailLine.className = "tooltip-line";
					detailLine.textContent = node.detail;
					topologyTooltip.appendChild(detailLine);
				}
			}

			topologyTooltip.hidden = false;
		});

		topologySvg.addEventListener("mousemove", (e) => {
			if (topologyTooltip.hidden) return;

			// Position tooltip near pointer, offset 12px, clamped to window
			const offsetX = 12;
			const offsetY = 12;
			let x = e.clientX + offsetX;
			let y = e.clientY + offsetY;

			// Clamp to window bounds
			const rect = topologyTooltip.getBoundingClientRect();
			const tooltipWidth = rect.width || 200; // fallback width
			const tooltipHeight = rect.height || 100; // fallback height

			if (x + tooltipWidth > window.innerWidth) {
				x = window.innerWidth - tooltipWidth - 8;
			}
			if (x < 0) {
				x = 8;
			}
			if (y + tooltipHeight > window.innerHeight) {
				y = window.innerHeight - tooltipHeight - 8;
			}
			if (y < 0) {
				y = 8;
			}

			topologyTooltip.style.left = x + "px";
			topologyTooltip.style.top = y + "px";
		});

		topologySvg.addEventListener("mouseout", (e) => {
			const nodeGroup = e.target.closest("g.node");
			if (!nodeGroup) return;
			topologyTooltip.hidden = true;
		});

		topologySvg.addEventListener("click", (e) => {
			const nodeGroup = e.target.closest("g.node");
			if (!nodeGroup) return;

			const nodeId = nodeGroup.getAttribute("data-id");
			if (!nodeId || !state.topology) return;

			const node = state.topology.nodes.find(n => n.id === nodeId);
			if (!node || node.kind !== "target") return;

			// Add to expanded targets
			state.expandedTargets.add(node.target);

			// Switch to table view
			showView("table");

			// Render targets (which will expand this one)
			if (state.lastData) {
				renderTargets(state.lastData.targets);

				// Find and scroll to the target row
				const targetName = node.target;
				let targetRow = null;
				const tbody = document.getElementById("targets");
				for (const row of tbody.querySelectorAll("tr.target-row")) {
					if (row.dataset.name === targetName) {
						targetRow = row;
						break;
					}
				}

				if (targetRow) {
					targetRow.scrollIntoView({ block: "center" });
					targetRow.classList.add("highlight");
					setTimeout(() => {
						targetRow.classList.remove("highlight");
					}, 1500);
				}
			}
		});

		// Wire up view toggle buttons
		document.getElementById("btnTopology").addEventListener("click", () => {
			showView("topology");
		});

		document.getElementById("btnTable").addEventListener("click", () => {
			showView("table");
		});

		// Listen to hash changes
		window.addEventListener("hashchange", () => {
			showView(currentView());
		});

		// Apply current view on load
		showView(currentView());

		// Initial fetch and set up auto-refresh
		fetchStatus();
		setInterval(fetchStatus, 10000);
	</script>
</body>
</html>
