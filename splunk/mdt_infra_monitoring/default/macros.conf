# Switch telemetry arrives from three sources with different metric names and dimensions:
#   Cribl (sw11-13):        if-stats.*, cpu-util.usage, mem-stats.usage, poe-stats.*  dims node, interface
#                           plus CDP/MAC events in index cisco_events
#   gnmic IOS-XE (sw98/99): mdt_xe_*                                                 dims extracted_source, interface_name
#   gnmic NX-OS (cores):    mdt_nx_*                                                 dims extracted_source, interface_name
#   OTel yang_grpc dial-out: cisco.* (only what filter/cisco in otel.yaml keeps)    dims node_id, name (interface)
# These macros return one common shape per topic, keyed by node and interface.
# mstats drops series that lack a BY dimension, so label-valued metrics need their own mstats.
# No literal dollar signs in definitions: Splunk would read them as macro arguments.
# Macros that generate results start with mstats (no pipe) and are called as | `mdt_x(...)`.

# Every device that reports interface data. Columns: node
[mdt_nodes]
definition = mstats count(_value) WHERE index=cisco_metrics metric_name="if-stats.oper_status" BY node \
| append [| mstats count(_value) WHERE index=cisco_metrics (metric_name="mdt_xe_if_stats_in_octets" OR metric_name="mdt_nx_if_stats_in_octets") BY extracted_source | rename extracted_source as node] \
| append [| mstats count(_value) WHERE index=cisco_metrics metric_name="cisco.in-octets" BY node_id | rename node_id as node] \
| stats count by node | fields node | sort node

# Latest interface state. Columns: node interface admin_up oper_up speed (bit/s) last_change (epoch seconds)
[mdt_if_status(1)]
args = node
definition = mstats latest("if-stats.oper_status") as oper_up latest("if-stats.admin_status") as admin_up latest("if-stats.speed") as speed latest("if-stats.last_change") as last_change WHERE index=cisco_metrics node="$node$" BY node interface \
| append [| mstats latest_time(_value) as t WHERE index=cisco_metrics (metric_name="mdt_xe_if_info_oper_status" OR metric_name="mdt_nx_if_info_oper_status") extracted_source="$node$" BY extracted_source interface_name oper_status \
  | sort 0 - t | dedup extracted_source interface_name | eval oper_up=if(match(oper_status, "(?i)^(up|if-oper-state-ready)"), 1, 0) | fields extracted_source interface_name oper_up] \
| append [| mstats latest_time(_value) as t WHERE index=cisco_metrics (metric_name="mdt_xe_if_info_admin_status" OR metric_name="mdt_nx_if_info_admin_status") extracted_source="$node$" BY extracted_source interface_name admin_status \
  | sort 0 - t | dedup extracted_source interface_name | eval admin_up=if(match(admin_status, "(?i)^(up|if-state-up)"), 1, 0) | fields extracted_source interface_name admin_up] \
| append [| mstats latest(_value) as speed WHERE index=cisco_metrics metric_name="mdt_xe_if_stats_speed" extracted_source="$node$" BY extracted_source interface_name] \
| append [| mstats latest_time(_value) as t WHERE index=cisco_metrics metric_name="mdt_nx_if_info_port_speed" extracted_source="$node$" BY extracted_source interface_name port_speed \
  | sort 0 - t | dedup extracted_source interface_name \
  | rex field=port_speed "SPEED_(?<n>\d+)(?<unit>[GM])B" | eval speed=n * if(unit=="G", 1000000000, 1000000) | fields extracted_source interface_name speed] \
| append [| mstats count(_value) WHERE index=cisco_metrics metric_name="mdt_xe_if_info_last_change" extracted_source="$node$" BY extracted_source interface_name last_change \
  | eval last_change=strptime(replace(last_change, "\.\d+", ""), "%Y-%m-%dT%H:%M:%S%:z") | stats max(last_change) as last_change by extracted_source interface_name] \
| append [| mstats latest(_value) as last_change WHERE index=cisco_metrics metric_name="mdt_nx_if_info_last_change" extracted_source="$node$" BY extracted_source interface_name \
  | eval last_change=if(last_change > 1000000000000000000, last_change / 1000000000, null())] \
| append [| mstats latest_time(_value) as t latest(_value) as speed WHERE index=cisco_metrics metric_name="cisco.speed" node_id="$node$" BY node_id name oper-status admin-status last-change \
  | sort 0 - t | dedup node_id name \
  | eval oper_up=if('oper-status'=="if-oper-state-ready", 1, 0), admin_up=if('admin-status'=="if-state-up", 1, 0), last_change=strptime(replace('last-change', "\.\d+", ""), "%Y-%m-%dT%H:%M:%S%:z") \
  | rename node_id as extracted_source, name as interface_name | fields extracted_source interface_name oper_up admin_up speed last_change] \
| eval node=coalesce(node, extracted_source), interface=coalesce(interface, interface_name) \
| stats max(admin_up) as admin_up max(oper_up) as oper_up max(speed) as speed max(last_change) as last_change by node interface

# Keeps front-panel ports only (drops VLAN, loopback, port-channel, management and similar interfaces).
[mdt_physical_ports]
definition = where NOT match(interface, "(?i)^(vlan|loopback|port-channel|po\d|tunnel|null|app|bluetooth|mgmt|nve|GigabitEthernet0/0)")

# Interface counters per minute. Columns: _time node interface in_octets out_octets in_errors out_errors
[mdt_if_counters(2)]
args = node, interface
definition = mstats latest("if-stats.in_octets") as in_octets latest("if-stats.out_octets") as out_octets latest("if-stats.in_errors") as in_errors latest("if-stats.out_errors") as out_errors WHERE index=cisco_metrics node="$node$" interface="$interface$" span=1m BY node interface \
| append [| mstats latest(mdt_xe_if_stats_in_octets) as in_octets latest(mdt_xe_if_stats_out_octets) as out_octets latest(mdt_xe_if_stats_in_errors) as in_errors latest(mdt_xe_if_stats_out_errors) as out_errors WHERE index=cisco_metrics extracted_source="$node$" interface_name="$interface$" span=1m BY extracted_source interface_name] \
| append [| mstats latest(mdt_nx_if_stats_in_octets) as in_octets latest(mdt_nx_if_stats_out_octets) as out_octets latest(mdt_nx_if_stats_in_errors) as in_errors latest(mdt_nx_if_stats_out_errors) as out_errors WHERE index=cisco_metrics extracted_source="$node$" interface_name="$interface$" span=1m BY extracted_source interface_name] \
| append [| mstats latest("cisco.in-octets") as in_octets latest("cisco.out-octets") as out_octets latest("cisco.in-errors") as in_errors latest("cisco.out-errors") as out_errors WHERE index=cisco_metrics node_id="$node$" name="$interface$" span=1m BY node_id name | rename node_id as extracted_source, name as interface_name] \
| eval node=coalesce(node, extracted_source), interface=coalesce(interface, interface_name) | fields - extracted_source interface_name

# Turns mdt_if_counters output into rates. Adds in_bps out_bps in_errs out_errs (errors per sample);
# a counter that went backwards (reset, reboot) yields no rate for that sample.
[mdt_if_rates]
definition = sort 0 node interface _time \
| streamstats current=f window=1 last(_time) as p_t last(in_octets) as p_in last(out_octets) as p_out last(in_errors) as p_ie last(out_errors) as p_oe by node interface \
| eval dt=_time - p_t \
| where dt > 0 \
| eval in_bps=if(in_octets >= p_in, (in_octets - p_in) * 8 / dt, null()), out_bps=if(out_octets >= p_out, (out_octets - p_out) * 8 / dt, null()) \
| eval in_errs=if(in_errors >= p_ie, in_errors - p_ie, null()), out_errs=if(out_errors >= p_oe, out_errors - p_oe, null()) \
| fields - p_t p_in p_out p_ie p_oe dt

# CPU per minute. Columns: _time node cpu (percent) load (NX-OS only reports the 1-minute load average)
[mdt_cpu(1)]
args = node
definition = mstats avg("cpu-util.usage") as cpu WHERE index=cisco_metrics node="$node$" span=1m BY node \
| append [| mstats avg(mdt_xe_cpu_stats_one_minute) as cpu WHERE index=cisco_metrics extracted_source="$node$" span=1m BY extracted_source] \
| append [| mstats avg(mdt_nx_cpu_stats_loadAverage1m) as load WHERE index=cisco_metrics extracted_source="$node$" span=1m BY extracted_source] \
| append [| mstats avg("cisco.one-minute") as cpu WHERE index=cisco_metrics node_id="$node$" span=1m BY node_id | rename node_id as extracted_source] \
| eval node=coalesce(node, extracted_source) | fields - extracted_source

# Memory per minute. Columns: _time node mem (percent used)
[mdt_mem(1)]
args = node
definition = mstats avg("mem-stats.usage") as mem WHERE index=cisco_metrics node="$node$" span=1m BY node \
| append [| mstats avg(mdt_xe_mem_stats_used_memory) as used avg(mdt_xe_mem_stats_total_memory) as total WHERE index=cisco_metrics extracted_source="$node$" memory_statistic_name="Processor" span=1m BY extracted_source | eval mem=used / total * 100] \
| append [| mstats avg(mdt_nx_mem_stats_curr) as mem WHERE index=cisco_metrics extracted_source="$node$" span=1m BY extracted_source] \
| append [| mstats avg("cisco.used-memory") as used avg("cisco.total-memory") as total WHERE index=cisco_metrics node_id="$node$" name="Processor" span=1m BY node_id | eval mem=used / total * 100 | rename node_id as extracted_source] \
| eval node=coalesce(node, extracted_source), mem=round(mem, 1) | fields _time node mem

# Latest PoE power. Columns: node used free (watts)
[mdt_poe(1)]
args = node
definition = mstats latest("poe-stats.allocated") as used latest("poe-stats.available") as free WHERE index=cisco_metrics node="$node$" BY node \
| append [| mstats latest(mdt_xe_poe_stats_power_allocated) as used latest(mdt_xe_poe_stats_power_budget) as budget WHERE index=cisco_metrics extracted_source="$node$" BY extracted_source poe_switch_switch_num \
  | stats sum(used) as used sum(budget) as budget by extracted_source | eval free=budget - used | rename extracted_source as node] \
| append [| mstats latest("cisco.power-allocated") as used latest("cisco.power-budget") as budget WHERE index=cisco_metrics node_id="$node$" BY node_id power-stack-name \
  | stats sum(used) as used sum(budget) as budget by node_id | eval free=budget - used | rename node_id as node] \
| fields node used free

# CDP neighbours. Columns: node interface neighbour remote_interface (empty where the source does not report it)
[mdt_cdp(1)]
args = node
definition = mstats latest(_value) WHERE index=cisco_metrics metric_name="mdt_nx_cdp_info_devId" extracted_source="$node$" BY extracted_source interface_name devId \
| eval neighbour=devId \
| append [| mstats latest(_value) WHERE index=cisco_metrics metric_name="mdt_xe_cdp_info_device_name" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id device_name \
  | join type=left extracted_source cdp_neighbor_detail_device_id [| mstats latest(_value) WHERE index=cisco_metrics metric_name="mdt_xe_cdp_info_local_intf_name" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id local_intf_name] \
  | join type=left extracted_source cdp_neighbor_detail_device_id [| mstats latest(_value) WHERE index=cisco_metrics metric_name="mdt_xe_cdp_info_port_id" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id port_id] \
  | eval neighbour=device_name, interface_name=local_intf_name, remote_interface=port_id] \
| append [| mstats latest(_value) WHERE index=cisco_metrics metric_name="cisco.device-name_info" node_id="$node$" BY node_id device-name local-intf-name port-id \
  | eval extracted_source=node_id, interface_name='local-intf-name', neighbour='device-name', remote_interface='port-id'] \
| append [search index=cisco_events event_group=cdp node="$node$" \
  | eval node=mvindex(node, 0), interface=mvindex(interface, 0), neighbour=mvindex(neighbour, 0), remote_interface=mvindex(remote_interface, 0)] \
| eval node=coalesce(node, extracted_source), interface=coalesce(interface, interface_name), neighbour=lower(replace(neighbour, "[.(].*", "")) \
| stats latest(remote_interface) as remote_interface by node interface neighbour

# MAC address table. Columns: node interface vlan mac. gnmic IOS-XE (sw98/99) reports no MAC/port detail yet; OTel has no VLAN.
[mdt_mac(2)]
args = node, interface
definition = mstats latest(_value) WHERE index=cisco_metrics metric_name="mdt_nx_mac_info_age" extracted_source="$node$" BY extracted_source port vlan mac \
| eval node=extracted_source, interface=port, vlan=replace(vlan, "^vlan-", "") \
| append [search index=cisco_events event_group=mac node="$node$" \
  | eval node=mvindex(node, 0), interface=mvindex(interface, 0), vlan=mvindex(vlan, 0), mac=mvindex(mac, 0)] \
| append [| mstats latest(_value) WHERE index=cisco_metrics metric_name="cisco.port_info" node_id="$node$" BY node_id port mac | eval node=node_id, interface=port] \
| eval interface=case(match(interface, "^Gi\d"), replace(interface, "^Gi", "GigabitEthernet"), match(interface, "^Te\d"), replace(interface, "^Te", "TenGigabitEthernet"), match(interface, "^Tw\d"), replace(interface, "^Tw", "TwoGigabitEthernet"), match(interface, "^Fo\d"), replace(interface, "^Fo", "FortyGigabitEthernet"), match(interface, "^Po\d"), replace(interface, "^Po", "Port-channel"), match(interface, "^Vl\d"), replace(interface, "^Vl", "Vlan"), true(), interface) \
| search interface="$interface$" | fillnull value="-" vlan \
| stats count by node interface vlan mac | fields - count
