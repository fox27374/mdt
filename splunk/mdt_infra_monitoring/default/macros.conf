# Index names used by every search. Default names shown; to use other indexes, override in local/macros.conf
# or in Settings > Advanced search > Search macros (no need to edit this file).
[mdt_metrics_index]
definition = index=cisco_metrics

# Event (syslog) index. Override in local/macros.conf or Settings > Advanced search > Search macros.
[mdt_syslog_index]
definition = index=cisco_syslog

# Switch telemetry arrives from three sources with different metric names:
#   gnmic IOS-XE:           mdt_xe_*                                                 dims extracted_source, interface_name
#   gnmic NX-OS (cores):    mdt_nx_*                                                 dims extracted_source, interface_name
#   OTel yang_grpc dial-out: cisco.* (filter/cisco and transform/cisco in otel.yaml)  dims extracted_source, interface_name
# Per-port PoE: gnmic publishes oper-state and pd-class as value-1 series with the state as a label (mdt_xe_poe_stats_oper_state),
# OTel carries them as labels on cisco.power-consumption (oper-state, pd-class), so mdt_poe_port reads both.
# These macros return one common shape per topic, keyed by node and interface.
# mstats drops series that lack a BY dimension, so label-valued metrics need their own mstats.
# No literal dollar signs in definitions: Splunk would read them as macro arguments.
# Macros that generate results start with mstats (no pipe) and are called as | `mdt_x(...)`.
# Switch model per stack member: the chassis part number from gnmic inventory (mdt_xe_inventory_part_number, hourly), else the
# platform a CDP neighbour reports for the switch (cisco.device-name_info). mdt_model reads both.

# Every device that reported interface data since <since> (a Splunk time like -24h). Columns: node
[mdt_nodes(1)]
args = since
definition = mstats count(_value) WHERE `mdt_metrics_index` earliest=$since$ (metric_name="mdt_xe_if_stats_in_octets" OR metric_name="mdt_nx_if_stats_in_octets" OR metric_name="cisco.in-octets") BY extracted_source \
| rename extracted_source as node \
| stats count by node | fields node | sort node

# Latest interface state. Columns: node interface admin_up oper_up speed (bit/s) last_change (epoch seconds) duplex (full, half or empty)
# autoneg (yes, no or empty) mtu (bytes). Same families as the speed: XE, NX, PAN-OS dial-in and cisco.* dial-out.
[mdt_if_status(1)]
args = node
definition = mstats latest_time(_value) as t WHERE `mdt_metrics_index` (metric_name="mdt_xe_if_info_oper_status" OR metric_name="mdt_nx_if_info_oper_status") extracted_source="$node$" BY extracted_source interface_name oper_status \
| sort 0 - t | dedup extracted_source interface_name | eval oper_up=if(match(oper_status, "(?i)^(up|if-oper-state-ready)"), 1, 0) | fields extracted_source interface_name oper_up \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` (metric_name="mdt_xe_if_info_admin_status" OR metric_name="mdt_nx_if_info_admin_status") extracted_source="$node$" BY extracted_source interface_name admin_status \
  | sort 0 - t | dedup extracted_source interface_name | eval admin_up=if(match(admin_status, "(?i)^(up|if-state-up)"), 1, 0) | fields extracted_source interface_name admin_up] \
| append [| mstats latest(_value) as speed WHERE `mdt_metrics_index` metric_name="mdt_xe_if_stats_speed" extracted_source="$node$" BY extracted_source interface_name] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_nx_if_info_port_speed" extracted_source="$node$" BY extracted_source interface_name port_speed \
  | sort 0 - t | dedup extracted_source interface_name \
  | rex field=port_speed "SPEED_(?<n>\d+)(?<unit>[GM])B" | eval speed=n * if(unit=="G", 1000000000, 1000000) | fields extracted_source interface_name speed] \
| append [| mstats count(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_if_info_last_change" extracted_source="$node$" BY extracted_source interface_name last_change \
  | eval last_change=strptime(replace(last_change, "\.\d+", ""), "%Y-%m-%dT%H:%M:%S%:z") | stats max(last_change) as last_change by extracted_source interface_name] \
| append [| mstats latest(_value) as last_change WHERE `mdt_metrics_index` metric_name="mdt_nx_if_info_last_change" extracted_source="$node$" BY extracted_source interface_name \
  | eval last_change=if(last_change > 1000000000000000000, last_change / 1000000000, null())] \
| append [| mstats latest_time(_value) as t latest(_value) as speed WHERE `mdt_metrics_index` metric_name="cisco.speed" extracted_source="$node$" BY extracted_source interface_name oper-status admin-status \
  | sort 0 - t | dedup extracted_source interface_name | eval speed=speed / 1.024 \
  | eval oper_up=if('oper-status'=="if-oper-state-ready", 1, 0), admin_up=if('admin-status'=="if-state-up", 1, 0) \
  | fields extracted_source interface_name oper_up admin_up speed] \
| append [| mstats latest("cisco.last-change") as last_change WHERE `mdt_metrics_index` extracted_source="$node$" BY extracted_source interface_name] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` (metric_name="mdt_xe_if_info_negotiated_duplex_mode" OR metric_name="mdt_nx_if_info_negotiated_duplex_mode" OR metric_name="mdt_panos_if_info_negotiated_duplex_mode" OR metric_name="cisco.speed") extracted_source="$node$" BY extracted_source interface_name negotiated_duplex_mode \
  | sort 0 - t | dedup extracted_source interface_name | eval duplex=`mdt_duplex(negotiated_duplex_mode)` | fields extracted_source interface_name duplex] \
| append [| mstats latest(_value) as autoneg_v WHERE `mdt_metrics_index` (metric_name="mdt_xe_if_info_auto_negotiate" OR metric_name="mdt_nx_if_info_auto_negotiate" OR metric_name="mdt_panos_if_info_auto_negotiate" OR metric_name="cisco.ether-state.auto-negotiate") extracted_source="$node$" BY extracted_source interface_name \
  | eval autoneg=if(autoneg_v == 1, "yes", "no") | fields extracted_source interface_name autoneg] \
| append [| mstats latest(_value) as mtu WHERE `mdt_metrics_index` (metric_name="mdt_xe_if_info_mtu" OR metric_name="mdt_nx_if_info_mtu" OR metric_name="mdt_panos_if_info_mtu" OR metric_name="cisco.mtu") extracted_source="$node$" BY extracted_source interface_name] \
| eval node=extracted_source, interface=interface_name \
| stats max(admin_up) as admin_up max(oper_up) as oper_up max(speed) as speed max(last_change) as last_change max(duplex) as duplex max(autoneg) as autoneg max(mtu) as mtu by node interface

# Duplex in one form: full or half (IOS-XE full-duplex, Nexus FULL, PAN-OS FULL). Anything else (UNSET, unknown, empty) is null.
[mdt_duplex(1)]
args = d
definition = case(match($d$, "(?i)^full"), "full", match($d$, "(?i)^half"), "half", true(), null())

# True for front-panel ports (not VLAN, loopback, port-channel, management and similar interfaces).
[mdt_is_physical]
definition = NOT match(interface, "(?i)^(vlan|loopback|port-channel|po\d|tunnel|null|app|bluetooth|mgmt|nve|control plane|GigabitEthernet0/0)")

# Keeps front-panel ports only.
[mdt_physical_ports]
definition = where `mdt_is_physical`

# Interface counters per minute. Columns: _time node interface in_octets out_octets in_errors out_errors
# One mstats over the XE, NX and dial-out (cisco.*) families: no append subsearch, so no 50k-row cap over long ranges.
[mdt_if_counters(2)]
args = node, interface
definition = mstats latest(mdt_xe_if_stats_in_octets) as xi latest(mdt_xe_if_stats_out_octets) as xo latest(mdt_xe_if_stats_in_errors) as xie latest(mdt_xe_if_stats_out_errors) as xoe \
  latest(mdt_nx_if_stats_in_octets) as ni latest(mdt_nx_if_stats_out_octets) as no latest(mdt_nx_if_stats_in_errors) as nie latest(mdt_nx_if_stats_out_errors) as noe \
  latest("cisco.in-octets") as ci latest("cisco.out-octets") as co latest("cisco.in-errors") as cie latest("cisco.out-errors") as coe \
  WHERE `mdt_metrics_index` extracted_source="$node$" interface_name="$interface$" span=1m BY extracted_source interface_name \
| eval in_octets=coalesce(xi, ni, ci), out_octets=coalesce(xo, no, co), in_errors=coalesce(xie, nie, cie), out_errors=coalesce(xoe, noe, coe) \
| where isnotnull(in_octets) OR isnotnull(out_octets) OR isnotnull(in_errors) OR isnotnull(out_errors) \
| eval node=extracted_source, interface=interface_name | fields - extracted_source interface_name xi xo xie xoe ni no nie noe ci co cie coe

# Detail error counters per minute, cumulative (gnmic and OTel dial-out). Columns: _time node interface crc oversize_rx undersize_rx fragment_rx jabber_rx tx_errors oversize_tx
# tx_errors is NX internalMacTransmitErrors (what NX out-errors counts); oversize_tx is NX txOversizePkts. A platform without a counter leaves its column out.
[mdt_if_detail(2)]
args = node, interface
definition = mstats latest(mdt_xe_if_stats_in_crc_errors) as crc latest(mdt_xe_if_stats_in_oversize_frames) as oversize_rx latest(mdt_xe_if_stats_in_undersize_frames) as undersize_rx latest(mdt_xe_if_stats_in_fragment_frames) as fragment_rx latest(mdt_xe_if_stats_in_jabber_frames) as jabber_rx WHERE `mdt_metrics_index` extracted_source="$node$" interface_name="$interface$" span=1m BY extracted_source interface_name \
| append [| mstats latest(mdt_nx_if_stats_in_crc_errors) as crc latest(mdt_nx_if_stats_in_oversize_frames) as oversize_rx latest(mdt_nx_if_stats_in_fragment_frames) as fragment_rx latest(mdt_nx_if_stats_in_jabber_frames) as jabber_rx latest(mdt_nx_if_errors_internalMacTransmitErrors) as tx_errors latest(mdt_nx_if_errors_txOversizePkts) as oversize_tx WHERE `mdt_metrics_index` extracted_source="$node$" interface_name="$interface$" span=1m BY extracted_source interface_name] \
| append [| mstats latest("cisco.in-crc-errors") as crc latest("cisco.ether-stats.in-oversize-frames") as oversize_rx latest("cisco.ether-stats.in-undersize-frames") as undersize_rx latest("cisco.ether-stats.in-fragment-frames") as fragment_rx latest("cisco.ether-stats.in-jabber-frames") as jabber_rx WHERE `mdt_metrics_index` extracted_source="$node$" interface_name="$interface$" span=1m BY extracted_source interface_name] \
| eval node=extracted_source, interface=interface_name | fields - extracted_source interface_name

# Turns mdt_if_counters output into rates. Adds in_bps out_bps in_errs out_errs (errors per sample);
# a counter that went backwards (reset, reboot) yields no rate for that sample.
[mdt_if_rates]
definition = sort 0 node interface _time \
| streamstats current=f window=1 last(_time) as p_t last(in_octets) as p_in last(out_octets) as p_out last(in_errors) as p_ie last(out_errors) as p_oe by node interface \
| eval dt=_time - p_t \
| where dt > 0 \
| eval in_bps=if(in_octets >= p_in, (in_octets - p_in) * 8 / dt, null()), out_bps=if(out_octets >= p_out, (out_octets - p_out) * 8 / dt, null()) \
| eval in_errs=if(in_errors >= p_ie, in_errors - p_ie, null()), out_errs=if(out_errors >= p_oe, out_errors - p_oe, null()) \
| fields - p_t p_in p_out p_ie p_oe dt

# CPU per minute. Columns: _time node cpu (percent)
[mdt_cpu(1)]
args = node
definition = mstats avg(mdt_xe_cpu_stats_one_minute) as cpu WHERE `mdt_metrics_index` extracted_source="$node$" span=1m BY extracted_source \
| append [| mstats avg(mdt_nx_cpu_stats_idle) as idle WHERE `mdt_metrics_index` extracted_source="$node$" span=1m BY extracted_source | eval cpu=100 - idle | fields - idle] \
| append [| mstats avg("cisco.one-minute") as cpu WHERE `mdt_metrics_index` extracted_source="$node$" span=1m BY extracted_source] \
| rename extracted_source as node

# Memory per minute. Columns: _time node mem (percent used)
[mdt_mem(1)]
args = node
definition = mstats avg(mdt_xe_mem_stats_used_memory) as used avg(mdt_xe_mem_stats_total_memory) as total WHERE `mdt_metrics_index` extracted_source="$node$" memory_statistic_name="Processor" span=1m BY extracted_source | eval mem=used / total * 100 \
| append [| mstats avg(mdt_nx_mem_stats_curr) as mem WHERE `mdt_metrics_index` extracted_source="$node$" span=1m BY extracted_source] \
| append [| mstats avg("cisco.used-memory") as used avg("cisco.total-memory") as total WHERE `mdt_metrics_index` extracted_source="$node$" pool="Processor" span=1m BY extracted_source | eval mem=used / total * 100] \
| eval node=extracted_source, mem=round(mem, 1) | fields _time node mem

# PoE draw and remaining PoE budget. Columns: node used free (watts). Switches without PoE (both 0) return no row.
[mdt_poe(1)]
args = node
definition = mstats latest(mdt_xe_poe_stats_consumed_poe_power) as used latest(mdt_xe_poe_stats_available_power) as free WHERE `mdt_metrics_index` extracted_source="$node$" BY extracted_source poe_switch_switch_num \
| append [| mstats latest("cisco.consumed-poe-power") as used latest("cisco.available-power") as free WHERE `mdt_metrics_index` extracted_source="$node$" BY extracted_source power-stack-name] \
| stats sum(used) as used sum(free) as free by extracted_source | rename extracted_source as node \
| where used + free > 0

# PoE per port. Columns: node interface poe_w (W drawn now) poe_state (ok, deny, off or empty) pd_class (IEEE class 0-5, or the raw name)
[mdt_poe_port(1)]
args = node
definition = mstats latest(mdt_xe_poe_stats_power_consumption) as poe_w WHERE `mdt_metrics_index` extracted_source="$node$" BY extracted_source interface_name \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_poe_stats_oper_state" extracted_source="$node$" BY extracted_source interface_name oper_state \
  | sort 0 - t | dedup extracted_source interface_name | rename oper_state as poe_state_raw | fields extracted_source interface_name poe_state_raw] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_poe_stats_pd_class" extracted_source="$node$" BY extracted_source interface_name pd_class \
  | sort 0 - t | dedup extracted_source interface_name | rename pd_class as pd_class_raw | fields extracted_source interface_name pd_class_raw] \
| append [| mstats latest_time(_value) as t latest(_value) as poe_w WHERE `mdt_metrics_index` metric_name="cisco.power-consumption" extracted_source="$node$" BY extracted_source interface_name oper-state pd-class \
  | sort 0 - t | dedup extracted_source interface_name | rename "oper-state" as poe_state_raw, "pd-class" as pd_class_raw | fields extracted_source interface_name poe_w poe_state_raw pd_class_raw] \
| eval node=coalesce(node, extracted_source), interface=coalesce(interface, interface_name) \
| eval poe_state=case(match(poe_state_raw, "(?i)(deny|faulty|error)"), "deny", match(poe_state_raw, "(?i)^(on|.*ok)$"), "ok", match(poe_state_raw, "(?i)off"), "off", true(), null()) \
| eval pd_class=if(match(pd_class_raw, "ieee\d"), replace(pd_class_raw, ".*ieee(\d).*", "\1"), pd_class_raw) \
| stats max(poe_w) as poe_w first(poe_state) as poe_state first(pd_class) as pd_class by node interface

# CDP and LLDP neighbours (LLDP: Nexus only, named neighbours). Columns: node interface neighbour remote_interface platform ip (empty where the source
# does not report it). platform is CDP's, without the leading "cisco " (C9300L-24P-4X, CW9176I, N9K-C93180YC-FX); ip the neighbour's CDP address.
# A neighbour seen by both protocols is one row: names are lowercased without domain or serial.
[mdt_cdp(1)]
args = node
definition = mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_cdp_info_devId" extracted_source="$node$" BY extracted_source interface_name devId \
| join type=left extracted_source interface_name [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_cdp_info_portId" extracted_source="$node$" BY extracted_source interface_name portId | fields extracted_source interface_name portId] \
| join type=left extracted_source interface_name [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_cdp_info_platId" extracted_source="$node$" BY extracted_source interface_name platId | fields extracted_source interface_name platId] \
| join type=left extracted_source interface_name [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_cdp_info_addr" extracted_source="$node$" BY extracted_source interface_name addr | fields extracted_source interface_name addr] \
| eval neighbour=devId, remote_interface=portId, platform=platId, ip=addr \
| append [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_cdp_info_device_name" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id device_name \
  | join type=left extracted_source cdp_neighbor_detail_device_id [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_cdp_info_local_intf_name" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id local_intf_name] \
  | join type=left extracted_source cdp_neighbor_detail_device_id [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_cdp_info_port_id" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id port_id] \
  | join type=left extracted_source cdp_neighbor_detail_device_id [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_cdp_info_platform_name" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id platform_name] \
  | join type=left extracted_source cdp_neighbor_detail_device_id [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_cdp_info_ip_address" extracted_source="$node$" BY extracted_source cdp_neighbor_detail_device_id ip_address] \
  | eval neighbour=device_name, interface_name=local_intf_name, remote_interface=port_id, platform=platform_name, ip=ip_address] \
| append [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="cisco.device-name_info" extracted_source="$node$" BY extracted_source interface_name device-name port-id \
  | join type=left extracted_source interface_name [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="cisco.device-name_info" extracted_source="$node$" BY extracted_source interface_name platform-name | fields extracted_source interface_name platform-name] \
  | join type=left extracted_source interface_name [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="cisco.device-name_info" extracted_source="$node$" BY extracted_source interface_name ip-address | fields extracted_source interface_name ip-address] \
  | eval neighbour='device-name', remote_interface='port-id', platform='platform-name', ip='ip-address'] \
| append [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_lldp_info_sysName" extracted_source="$node$" BY extracted_source interface_name sysName \
  | join type=left extracted_source interface_name [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_lldp_info_portIdV" extracted_source="$node$" BY extracted_source interface_name portIdV | fields extracted_source interface_name portIdV] \
  | eval neighbour=sysName, remote_interface=portIdV] \
| eval node=coalesce(node, extracted_source), interface=coalesce(interface, interface_name), neighbour=lower(replace(neighbour, "[.(].*", "")), \
  platform=replace(platform, "^cisco ", "") \
| stats latest(remote_interface) as remote_interface latest(platform) as platform latest(ip) as ip by node interface neighbour

# Port-channel members. Columns: node po member (mdt_ifkey names: port-channel103, eth1/3, tengigabitethernet1/0/5). A member seen in
# the last 20 minutes (gnmic samples every 5 minutes), so a member taken out of a port-channel leaves the list after that.
# NX-OS: the port-channel's member tDn (nx_lag_info). IOS-XE: the member's aggregate-id (xe_lag_info).
[mdt_lag_members(1)]
args = node
definition = mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_nx_lag_info_member" extracted_source="$node$" BY extracted_source interface_name member \
| rename interface_name as po_raw, member as member_raw \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_lag_info_aggregate_id" extracted_source="$node$" BY extracted_source interface_name aggregate_id \
  | rename aggregate_id as po_raw, interface_name as member_raw] \
| where t > now() - 1200 \
| eval node=extracted_source, po=`mdt_ifkey(po_raw)`, member=`mdt_ifkey(member_raw)` \
| dedup node po member | fields node po member

# Port-channel VLANs. Columns: node po vlans, vlans as "trunk: all", "trunk: 81-86,89" or "access: 88".
# The latest value of each leaf per port-channel. NX-OS trunkVlans "1-4094" is all. IOS-XE trunk-vlans is only filled for a
# restricted trunk, so no value means all; dial-out sends one value per range. 16.12 dial-out never sends the port-channel's
# own VLANs, only the physical ports' (dialout-iosxe.yaml 57011): a port-channel without its own takes a member's, as the
# members carry the port-channel's switchport config. Other physical ports are left out.
[mdt_lag_vlans(1)]
args = node
definition = mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_nx_lag_info_mode" extracted_source="$node$" BY extracted_source interface_name mode \
| sort 0 - t | dedup extracted_source interface_name | fields extracted_source interface_name mode \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_nx_lag_info_accessVlan" extracted_source="$node$" BY extracted_source interface_name accessVlan \
  | sort 0 - t | dedup extracted_source interface_name | fields extracted_source interface_name accessVlan] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_nx_lag_info_trunkVlans" extracted_source="$node$" BY extracted_source interface_name trunkVlans \
  | sort 0 - t | dedup extracted_source interface_name | fields extracted_source interface_name trunkVlans] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_lag_info_interface_mode" extracted_source="$node$" BY extracted_source interface_name interface_mode \
  | sort 0 - t | dedup extracted_source interface_name | rename interface_mode as mode | fields extracted_source interface_name mode] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_lag_info_access_vlan" extracted_source="$node$" BY extracted_source interface_name access_vlan \
  | sort 0 - t | dedup extracted_source interface_name | rename access_vlan as accessVlan | fields extracted_source interface_name accessVlan] \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_lag_info_trunk_vlans" extracted_source="$node$" BY extracted_source interface_name trunk_vlans \
  | eventstats max(t) as last by extracted_source interface_name | where t == last | rename trunk_vlans as trunkVlans | fields extracted_source interface_name trunkVlans] \
| stats values(mode) as mode values(accessVlan) as accessVlan values(trunkVlans) as trunkVlans by extracted_source interface_name \
| eval node=extracted_source, port=`mdt_ifkey(interface_name)` \
| join type=left node port [| `mdt_lag_members($node$)` | rename member as port, po as member_of] \
| eval po=if(match(port, "^port-channel[0-9]"), port, member_of) | where isnotnull(po) \
| eval own=if(port == po, 1, 0) | sort 0 - own | dedup node po \
| eval mode=lower(mode), access=replace(accessVlan, "^vlan-", ""), trunk=replace(mvjoin(trunkVlans, ","), "\.\.", "-") \
| eval vlans=case(mode=="access", "access: ".coalesce(access, "-"), mode=="trunk", "trunk: ".if(isnull(trunk) OR trunk=="1-4094", "all", trunk), true(), null()) \
| where isnotnull(vlans) | fields node po vlans

# Port-channel speed on NX-OS (operSpeed: 25G, 10G, or auto when no member is up). Columns: node po speed (bit/s). IOS-XE port-channels
# have their speed in mdt_if_status. Stream in: none.
[mdt_lag_speed(1)]
args = node
definition = mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_nx_lag_info_operSpeed" extracted_source="$node$" BY extracted_source interface_name operSpeed \
| sort 0 - t | dedup extracted_source interface_name \
| rex field=operSpeed "^(?<n>[0-9]+)(?<unit>[GM])" | eval speed=n * if(unit=="G", 1000000000, 1000000) \
| eval node=extracted_source, po=`mdt_ifkey(interface_name)` | where match(po, "^port-channel[0-9]") | fields node po speed

# Switch model per member. Columns: node member model (for example C9300-24P; empty where no source names the switch).
# Inventory first, else the CDP platform of the switch as a neighbour reports it, matched by name without domain or serial suffix.
# The fallback has no stack member, so it is member 1. Inventory is hourly, so it is looked up over a week.
[mdt_model(1)]
args = node
definition = mstats latest_time(_value) as t WHERE `mdt_metrics_index` earliest=-7d metric_name="mdt_xe_inventory_part_number" extracted_source="$node$" BY extracted_source device_inventory_hw_dev_index part_number \
| eval priority=0 | sort 0 - t | dedup extracted_source device_inventory_hw_dev_index \
| rename device_inventory_hw_dev_index as member, part_number as model | fields extracted_source member model priority \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` earliest=-7d metric_name="cisco.part-no_info" extracted_source="$node$" BY extracted_source cname part-no \
  | eval member=replace(cname, "^Switch", ""), model=trim('part-no'), priority=0 | fields extracted_source member model priority] \
| append [| mstats latest(_value) as v WHERE `mdt_metrics_index` earliest=-7d metric_name="cisco.device-name_info" BY device-name platform-name \
  | eval name=lower(replace('device-name', "[.(].*", "")) | where name="$node$" \
  | eval extracted_source="$node$", member="1", model=replace('platform-name', "(?i)^cisco\s+", ""), priority=1 | fields extracted_source member model priority] \
| eval node=coalesce(node, extracted_source) \
| sort 0 priority | dedup node member | where isnotnull(model) AND model!="" | fields node member model

# Interface name in one form for matching across sources: lowercase, IOS-XE short names expanded (Gi1/0/24 and GigabitEthernet1/0/24 both become gigabitethernet1/0/24),
# Nexus Ethernet1/23 becomes eth1/23 (the name telemetry uses), Nexus po103 and IOS-XE Port-channel103 both become port-channel103. Use as: eval inorm=`mdt_ifkey(interface)`
[mdt_ifkey(1)]
args = f
definition = lower(case(match($f$, "^Gi\d"), replace($f$, "^Gi", "GigabitEthernet"), match($f$, "^Te\d"), replace($f$, "^Te", "TenGigabitEthernet"), match($f$, "^Twe\d"), replace($f$, "^Twe", "TwentyFiveGigE"), match($f$, "^Tw\d"), replace($f$, "^Tw", "TwoGigabitEthernet"), match($f$, "^Fo\d"), replace($f$, "^Fo", "FortyGigabitEthernet"), match($f$, "^Fi\d"), replace($f$, "^Fi", "FiftyGigE"), match($f$, "^Hu\d"), replace($f$, "^Hu", "HundredGigE"), match($f$, "^Fa\d"), replace($f$, "^Fa", "FastEthernet"), match($f$, "^Ap\d"), replace($f$, "^Ap", "AppGigabitEthernet"), match($f$, "^Ethernet\d"), replace($f$, "^Ethernet", "eth"), match($f$, "^[Pp][Oo]\d"), replace($f$, "^[Pp][Oo]", "Port-channel"), true(), $f$))

# Links between ports, one row per node and inorm (mdt_ifkey of interface). far_node far_inorm: the port at the other end, empty when unknown.
# Catalyst reports the far port in CDP. Nexus does not, so it comes from the neighbour's own CDP row that names this port (prio 1).
[mdt_links]
definition = `mdt_cdp(*)` | eval inorm=`mdt_ifkey(interface)`, rnorm=`mdt_ifkey(remote_interface)` \
| eval far_node=neighbour, far_inorm=rnorm, prio=if(isnull(rnorm), 2, 0) \
| appendpipe [| where isnotnull(rnorm) | eval far_node=node, far_inorm=inorm, node=neighbour, inorm=rnorm, prio=1 | fields node inorm far_node far_inorm prio] \
| sort 0 node inorm prio | dedup node inorm | fields node inorm far_node far_inorm

# VLAN of a port, for MACs whose VLAN is unknown (dial-out drops it, otel.yaml). Columns: node ik (mdt_ifkey) port_vlan:
# the access VLAN, or "trunk" (a trunk port's MACs can be in any of its VLANs). Only dial-out switches have physical ports here.
[mdt_port_vlan(1)]
args = node
definition = mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_lag_info_interface_mode" extracted_source="$node$" BY extracted_source interface_name interface_mode \
| append [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name="mdt_xe_lag_info_access_vlan" extracted_source="$node$" BY extracted_source interface_name access_vlan] \
| sort 0 - t | stats first(interface_mode) as mode first(access_vlan) as access by extracted_source interface_name \
| eval node=extracted_source, ik=`mdt_ifkey(interface_name)`, port_vlan=if(lower(mode) == "trunk", "trunk", access) \
| where isnotnull(port_vlan) | fields node ik port_vlan

# MAC address table. Columns: node interface vlan mac. Dial-out has no VLAN: the port's (mdt_port_vlan).
[mdt_mac(2)]
args = node, interface
definition = mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_nx_mac_info_age" extracted_source="$node$" BY extracted_source port vlan mac \
| eval node=extracted_source, interface=port, vlan=replace(vlan, "^vlan-", "") \
| append [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="mdt_xe_mac_info_port" extracted_source="$node$" BY extracted_source port matm_mac_entry_mac matm_mac_entry_vlan_id_number \
  | eval node=extracted_source, interface=port, mac=matm_mac_entry_mac, vlan=matm_mac_entry_vlan_id_number] \
| append [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name="cisco.port_info" extracted_source="$node$" BY extracted_source port mac | eval node=extracted_source, interface=port] \
| eval interface=case(match(interface, "^Gi\d"), replace(interface, "^Gi", "GigabitEthernet"), match(interface, "^Te\d"), replace(interface, "^Te", "TenGigabitEthernet"), match(interface, "^Tw\d"), replace(interface, "^Tw", "TwoGigabitEthernet"), match(interface, "^Fo\d"), replace(interface, "^Fo", "FortyGigabitEthernet"), match(interface, "^Po\d"), replace(interface, "^Po", "Port-channel"), match(interface, "^Vl\d"), replace(interface, "^Vl", "Vlan"), true(), interface) \
| search interface="$interface$" \
| eval ik=`mdt_ifkey(interface)` | join type=left node ik [| `mdt_port_vlan($node$)`] \
| eval vlan=coalesce(vlan, port_vlan, if(match(interface, "^Vlan\d+$"), replace(interface, "^Vlan", ""), null())) \
| fillnull value="-" vlan \
| stats count by node interface vlan mac | fields - count

# Ports whose duplex or MTU differs from the port at the other end of the link (mdt_links). Both ends are listed, each as node.
# Columns: node inorm far_node far_inorm duplex far_duplex mtu far_mtu duplex_mm mtu_mm (1 when that value differs).
# A link is compared only where both ends report the value, so ports facing APs or switches without telemetry never show.
# mdt_if_status runs once: its rows (st=1) are appended, then eventstats copies them onto the near end (by k) and the far end (by j).
[mdt_link_mismatch]
definition = `mdt_links` | where isnotnull(far_inorm) | eval k=node."|".inorm, j=far_node."|".far_inorm \
| append [| `mdt_if_status(*)` | eval k=node."|".`mdt_ifkey(interface)`, j=k, st=1 | fields k j duplex mtu st] \
| eventstats max(duplex) as duplex max(mtu) as mtu by k \
| eventstats max(eval(if(st==1, duplex, null()))) as far_duplex max(eval(if(st==1, mtu, null()))) as far_mtu by j \
| where isnull(st) \
| eval duplex_mm=if(duplex != far_duplex, 1, 0), mtu_mm=if(mtu != far_mtu, 1, 0) \
| where duplex_mm == 1 OR mtu_mm == 1 \
| fields node inorm far_node far_inorm duplex far_duplex mtu far_mtu duplex_mm mtu_mm

# Health per switch, for a search over the last 15 minutes. Columns: node health cpu mem util errors duplex_mm mtu_mm
# util: busiest front-panel port, 5-minute average of in or out, % of link speed.
# errors: front-panel port with the most in + out errors, per minute. There are no packet counters, so no error ratio.
# duplex_mm, mtu_mm: ports with a duplex or MTU mismatch to the far end (mdt_link_mismatch).
# CPU, memory and util warn at 70 and are critical at 90 %; errors warn above 5/min and are critical from 100/min.
# A duplex mismatch is critical, an MTU mismatch a warning.
# Worst value wins. Switches only (interface data in the last 24 hours). "No data": none in the last 10 minutes.
[mdt_switch_health]
definition = `mdt_if_counters(*,*)` | `mdt_physical_ports` | `mdt_if_rates` \
| eval t=_time, errs=coalesce(in_errs, 0) + coalesce(out_errs, 0) | bin _time span=5m \
| stats avg(in_bps) as in_bps avg(out_bps) as out_bps sum(errs) as errs count as n max(t) as seen by node interface _time \
| join type=left node interface [| `mdt_if_status(*)` | fields node interface speed] \
| eval util=max(in_bps, out_bps) / speed * 100 \
| stats max(util) as util sum(errs) as errs sum(n) as n max(seen) as seen by node interface \
| eval errors=errs / n \
| stats max(util) as util max(errors) as errors max(seen) as seen by node \
| append [| `mdt_cpu(*)` | stats latest(cpu) as cpu by node] \
| append [| `mdt_mem(*)` | stats latest(mem) as mem by node] \
| append [| `mdt_link_mismatch` | stats sum(duplex_mm) as duplex_mm sum(mtu_mm) as mtu_mm by node] \
| append [| `mdt_nodes(-24h)` | eval known=1] \
| stats max(util) as util max(errors) as errors max(seen) as seen max(cpu) as cpu max(mem) as mem max(duplex_mm) as duplex_mm max(mtu_mm) as mtu_mm \
  max(known) as known by node \
| where known == 1 \
| eval cpu=round(cpu, 0), mem=round(mem, 0), util=round(util, 1), errors=round(errors, 0), duplex_mm=coalesce(duplex_mm, 0), mtu_mm=coalesce(mtu_mm, 0) \
| eval level=max(case(cpu >= 90, 2, cpu >= 70, 1, true(), 0), case(mem >= 90, 2, mem >= 70, 1, true(), 0), \
  case(util >= 90, 2, util >= 70, 1, true(), 0), case(errors >= 100, 2, errors > 5, 1, true(), 0), \
  case(duplex_mm > 0, 2, mtu_mm > 0, 1, true(), 0)) \
| eval health=case(isnull(seen) OR seen < now() - 600, "No data", level == 2, "Critical", level == 1, "Warning", true(), "OK") \
| fields node health cpu mem util errors duplex_mm mtu_mm

# Health per PAN-OS firewall, for a search over the last 15 minutes. Columns: node health sessions errors
# sessions: session table % (active / max). errors: interface with the most in + out errors, per minute (as mdt_switch_health).
# Sessions warn at 70 and are critical at 90 %; errors warn above 5/min and are critical from 100/min. No CPU (always 0 on PAN-OS).
# "No data": no interface data in the last 10 minutes.
[mdt_firewall_health]
definition = mstats latest(mdt_panos_if_stats_in_errors) as in_errors latest(mdt_panos_if_stats_out_errors) as out_errors WHERE `mdt_metrics_index` span=1m BY extracted_source interface_name \
| eval node=extracted_source, interface=interface_name | `mdt_if_rates` \
| eval t=_time, errs=coalesce(in_errs, 0) + coalesce(out_errs, 0) \
| stats sum(errs) as errs count as n max(t) as seen by node interface \
| eval errors=errs / n \
| stats max(errors) as errors max(seen) as seen by node \
| append [| mstats latest(mdt_panos_session_stats_active) as active latest(mdt_panos_session_stats_max) as max WHERE `mdt_metrics_index` BY extracted_source \
  | eval node=extracted_source, sessions=active / max * 100 | fields node sessions] \
| stats max(errors) as errors max(seen) as seen max(sessions) as sessions by node \
| eval sessions=round(sessions, 1), errors=round(errors, 0) \
| eval level=max(case(sessions >= 90, 2, sessions >= 70, 1, true(), 0), case(errors >= 100, 2, errors > 5, 1, true(), 0)) \
| eval health=case(isnull(seen) OR seen < now() - 600, "No data", level == 2, "Critical", level == 1, "Warning", true(), "OK") \
| fields node health sessions errors

# Health per AP, for a search over the last 15 minutes. Columns: wlc ap health state clients busy busy_band inter radios_down
# busy: worst radio's channel busy % (rx + tx + noise channel utilization), highest 1-minute value. inter: worst radio's non-WiFi interference %.
# Critical: AP not joined, an admin-enabled radio not up, busy from 75 % or interference from 50 %. Warning from 50 % busy or 25 % interference.
# "No data": nothing from the AP's WLC in the last 10 minutes. Every AP the WLC knows (name map), joined or not.
[mdt_ap_health]
definition = mstats latest(_value) latest_time(_value) as seen WHERE `mdt_metrics_index` metric_name=mdt_wl_info_eth_mac BY extracted_source eth_mac ap_name_mac_map_wtp_name \
| join type=left eth_mac [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name=mdt_wl_info_wtp_mac BY ethernet_mac_wtp_mac_map_ethernet_mac wtp_mac \
  | rename ethernet_mac_wtp_mac_map_ethernet_mac as eth_mac | fields eth_mac wtp_mac] \
| join type=left wtp_mac [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name=mdt_wl_info_ap_operation_state BY capwap_data_wtp_mac ap_operation_state \
  | rename capwap_data_wtp_mac as wtp_mac | fields wtp_mac ap_operation_state] \
| join type=left eth_mac [| mstats latest_time(_value) as t WHERE `mdt_metrics_index` metric_name=mdt_wl_client_stats_ap_mac_address BY dot11_oper_data_ms_mac_address ap_mac_address \
  | sort 0 - t | dedup dot11_oper_data_ms_mac_address | stats count as clients by ap_mac_address | rename ap_mac_address as eth_mac] \
| join type=left wtp_mac [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name=mdt_wl_radio_info_oper_state BY radio_oper_data_wtp_mac radio_oper_data_radio_slot_id oper_state \
  | join type=left radio_oper_data_wtp_mac radio_oper_data_radio_slot_id [| mstats latest(_value) WHERE `mdt_metrics_index` metric_name=mdt_wl_radio_info_admin_state BY radio_oper_data_wtp_mac radio_oper_data_radio_slot_id admin_state] \
  | stats count(eval(admin_state=="enabled" AND oper_state!="radio-up")) as radios_down by radio_oper_data_wtp_mac | rename radio_oper_data_wtp_mac as wtp_mac] \
| join type=left wtp_mac [| mstats max(mdt_wl_ap_stats_tx_util_percentage) as tx max(mdt_wl_ap_stats_rx_util_percentage) as rx \
  max(mdt_wl_ap_stats_rx_noise_channel_utilization) as noise max(mdt_wl_ap_stats_non_wifi_inter) as nonwifi \
  WHERE `mdt_metrics_index` span=1m BY rrm_measurement_wtp_mac rrm_measurement_radio_slot_id \
  | eval busy=coalesce(tx, 0) + coalesce(rx, 0) + coalesce(noise, 0) \
  | stats max(busy) as busy max(nonwifi) as inter by rrm_measurement_wtp_mac rrm_measurement_radio_slot_id \
  | eval busy_band=case(rrm_measurement_radio_slot_id=0, "2.4 GHz", rrm_measurement_radio_slot_id=1, "5 GHz", rrm_measurement_radio_slot_id=2, "6 GHz") \
  | sort 0 - busy | stats first(busy) as busy first(busy_band) as busy_band max(inter) as inter by rrm_measurement_wtp_mac | rename rrm_measurement_wtp_mac as wtp_mac] \
| eventstats max(seen) as wlc_seen by extracted_source \
| rename extracted_source as wlc, ap_name_mac_map_wtp_name as ap \
| eval state=if(ap_operation_state=="registered", "joined", "not joined"), joined=if(state=="joined", 1, 0) \
| eval busy=if(joined==1, round(busy, 0), null()), inter=if(joined==1, round(inter, 0), null()), radios_down=if(joined==1, coalesce(radios_down, 0), null()), clients=coalesce(clients, 0) \
| eval level=max(if(joined==1, 0, 2), if(radios_down > 0, 2, 0), case(busy >= 75, 2, busy >= 50, 1, true(), 0), case(inter >= 50, 2, inter >= 25, 1, true(), 0)) \
| eval health=case(wlc_seen < now() - 600, "No data", level == 2, "Critical", level == 1, "Warning", true(), "OK") \
| fields wlc ap health state clients busy busy_band inter radios_down

# Device role per node (stream in: field node; out: role, null when no valid entry matches). The sentinel row keeps join type=left from
# dropping every node while the collection is empty (join with an empty subsearch returns nothing). max=0: every entry is a candidate. Entries are in mdt_device_roles,
# pattern * is a wildcard (turned into % for like()); the longest matching pattern wins. Roles other than the six are ignored.
[mdt_roles]
definition = eval k=1 \
| join type=left max=0 k [| inputlookup mdt_device_roles | where role IN ("core", "distribution", "access", "wlc", "firewall", "server", "hidden") | eval k=1, pat=replace(pattern, "\*", "%"), prole=role | fields k pat prole \
  | append [| makeresults | eval k=1, pat="#none", prole="none" | fields k pat prole]] \
| eval m=if(like(node, pat), len(pat), -1) \
| eventstats max(m) as bm by node \
| eval role=if(m==bm AND m>=0, prole, null()) \
| eventstats max(role) as role by node \
| fields - k pat prole m bm

# One propagation pass of the topology rows: an unplaced node takes one below its highest placed neighbour (min row + 1).
# APs (ap=1) take a row from their switch but do not pass a row on: a device only reached through an AP is an island.
# The tree stops at row 3 (the AP row), so the APs stay the bottom row; deeper devices go to islands.
# Works on the records of mdt_topology_positions: node records (nbr empty) and directed edge records (nbr = neighbour, key = neighbour).
[mdt_topology_pass]
definition = eval rowsrc=if(ap==0, row, null()) \
| eventstats min(rowsrc) as nrow by key \
| eval cand=if(nbr!="" AND (coalesce(isl, 0)==1 OR nrow+1<=3), nrow+1, null()) \
| eventstats min(cand) as cmin by node \
| eval row=if(nbr=="" AND side==0, coalesce(row, cmin), row)

# x, y and value (role, AP or unmatched: the viz tooltip and drilldown field) per node for the Network Diagram Viz.
# Stream in: the topology rows with from, to, type. Out: from x y value, one row per node.
# Role hidden: the node and its links are left out (no position; the topology search then drops them).
# Rows top to bottom: firewalls -1, core 0, distribution 1, access 2, APs 3 (type wifi). wlc and server sit on the distribution row, right of the distribution switches.
# Firewalls (role firewall, or a firewall-* icon: PAN-OS telemetry, no role entry needed) sit above the cores, each at the mean x of its neighbours.
# ponytail: firewalls with the same mean x are spread 200 px apart, no ordering beyond that.
# Every tree row is centred under the widest one.
# Islands (not reached from a placed switch) right of the tree. APs follow their switch: in the tree they are moved to row 3, in an island they stay below their switch. With no role-assigned tree node, the highest-degree node is row 0. In islands every switch is row 0 and its APs row 1, directly under it; an island AP without a link sits on row 1 after the others.
# Devices below the AP row (an AP behind a row 3 switch) are islands too: they sit under their parent wherever it is.
# ponytail: island devices deeper than row 1 whose parent has no x yet fall back to the end of their row.
# Below the core, every second node in a tree row sits 40 px lower, so links within a row do not run through the nodes between.
# ponytail: 4 passes per round, so a chain more than 4 hops from its anchor drops to islands. Upgrade: loop until no change.
# Tree rows are placed top-down: a node is ordered by the midpoint of its upper neighbours' x (barycentre), so it sits under them.
# ponytail: one top-down sweep with the min/max midpoint, no crossing minimisation passes.
# Switches linked within the same row are kept together (group = smallest name among the node and its same-row neighbours, one hop only).
[mdt_topology_positions]
definition = eval ap=if(type=="wifi", 1, 0), fw=if(match(customurl, "/firewall-"), 1, 0), pair=if(isnotnull(to), mvappend(from."|".to, to."|".from), null()) \
| mvexpand pair \
| rex field=pair "(?<pn>[^|]+)\|(?<pm>.*)" \
| eval node=coalesce(pn, from), nbr=coalesce(pm, "") \
| fields node nbr ap fw \
| eventstats max(ap) as ap max(fw) as fw by node \
| `mdt_roles` \
| eval role=if(fw==1 AND isnull(role), "firewall", role) \
| eval hk=if(role=="hidden", 1, 0), ek=if(nbr=="", node, mvjoin(mvsort(mvappend(node, nbr)), "|")) \
| eventstats max(hk) as eh by ek \
| where eh==0 \
| eval side=if(ap==0 AND role IN ("wlc", "firewall", "server"), 1, 0) \
| eval rowfix=if(side==1 OR ap==1, null(), case(role=="core", 0, role=="distribution", 1, role=="access", 2, true(), null())) \
| dedup node nbr \
| eventstats count(eval(nbr!="")) as deg by node \
| eval key=if(nbr=="", node, nbr), row=if(nbr=="", rowfix, null()) \
| eventstats count(eval(nbr=="" AND side==0 AND ap==0 AND isnotnull(row))) as nroles, max(eval(if(side==0 AND ap==0, deg, null()))) as maxdeg \
| eval row=if(nroles==0 AND nbr=="" AND side==0 AND ap==0 AND deg>0 AND deg==maxdeg, 0, row) \
| `mdt_topology_pass` \
| `mdt_topology_pass` \
| `mdt_topology_pass` \
| `mdt_topology_pass` \
| eval isl=if(nbr=="" AND side==0 AND isnull(row), 1, 0) \
| eventstats max(isl) as isl by node \
| eval row=if(nbr=="" AND ap==1 AND isl==0, 3, row) \
| eval row=if(nbr=="" AND isl==1 AND ap==0, 0, row) \
| `mdt_topology_pass` \
| `mdt_topology_pass` \
| `mdt_topology_pass` \
| `mdt_topology_pass` \
| eval row=if(nbr=="" AND side==0 AND isnull(row), 0, row) \
| eventstats min(row) as nrow by key \
| eventstats max(row) as rowa by node \
| eval up=if(nbr!="" AND nrow<rowa, nbr, null()) \
| eventstats values(up) as ups min(eval(if(nrow==rowa-1, up, null()))) as parent by node \
| eval same=if(nbr!="" AND nrow==rowa, nbr, null()) \
| eventstats min(same) as grp by node \
| eval grp=if(isnull(grp) OR node<grp, node, grp) \
| eventstats values(eval(if(nbr!="", nbr, null()))) as nbrs by node \
| where nbr=="" \
| eval row=case(side==1 AND role=="firewall", -1, side==1 OR (isl==1 AND ap==1 AND isnull(parent)), 1, true(), row), orph=if(isnull(parent), 0, 1) \
| eval rk=case(role=="wlc", 0, role=="firewall", 1, role=="server", 2, true(), 3) \
| eventstats min(parent) as gparent by isl row grp \
| sort 0 isl row side rk orph gparent grp node \
| streamstats count as ord \
| `mdt_topology_place` \
| eval x=if(isl==0 AND row==0, 100 + 200 * (idx - 1) + 100 * (w - n), null()) \
| `mdt_topology_bary(1)` \
| `mdt_topology_bary(2)` \
| `mdt_topology_bary(3)` \
| streamstats count as sib by isl row parent \
| eventstats max(eval(if(isl==1 AND row==0, n, null()))) as n0 \
| eventstats max(eval(if(isl==0, x, null()))) as mx \
| eval base=mx + 400 \
| eval x=if(isl==1 AND row==0, base + 200 * (idx - 1), x) \
| eventstats values(eval(if(isnotnull(x), node."=".x, null()))) as isx \
| eval px=tonumber(replace(mvindex(isx, mvfind(isx, "^".parent."=")), "^.*=", "")) \
| eval x=case(isnotnull(x), x, orph==1 AND isnotnull(px), px + 200 * (sib - 1), true(), base + 200 * (coalesce(n0, 0) + idx - 1)) \
| eventstats values(eval(node."=".x)) as allx \
| eval fx=if(row==-1 AND isnotnull(nbrs), mvmap(nbrs, tonumber(replace(mvindex(allx, mvfind(allx, "^".nbrs."=")), "^.*=", ""))), null()) \
| eval x=if(isnotnull(fx), round(avg(fx)), x) \
| sort 0 row x node | streamstats count as fsib by row x | eval x=if(row==-1, x + 200 * (fsib - 1), x) \
| eval y=100 + 150 * row + if(isl==0 AND side==0 AND row>0, 40 * (idx % 2), 0) \
| eval value=case(ap==1, "AP", isnotnull(role), role, true(), "unmatched") \
| rename node as from \
| fields from x y value

# Order (idx) and row width (n, w) from the field ord. Used by mdt_topology_positions.
[mdt_topology_place]
definition = sort 0 isl row side rk ord node \
| streamstats count as idx by isl row \
| eventstats count as n by isl row \
| eventstats max(eval(if(isl==0, n, null()))) as w

# Barycentre step for tree row r: each node goes to the midpoint of its upper neighbours' x (ups); a node is
# pushed right only to keep 200 px from the one before (x = 200 * idx + running max of bary - 200 * idx); then the row is
# shifted so it is centred on its barycentres.
# Same-row link groups stay together (grp); side roles follow the tree nodes of their row. Used by mdt_topology_positions.
[mdt_topology_bary(1)]
args = r
definition = eventstats values(eval(if(isl==0 AND row<$r$, node."=".x, null()))) as known \
| eval upx=if(isl==0 AND side==0 AND row==$r$ AND isnotnull(ups), mvmap(ups, tonumber(replace(mvindex(known, mvfind(known, "^".ups."=")), "^.*=", ""))), null()) \
| eval bv=if(isnotnull(upx), (min(upx) + max(upx)) / 2, null()) \
| eventstats min(bv) as gb by isl row grp \
| eval ord=if(isl==0 AND side==0 AND row==$r$, coalesce(gb, -100000 + ord), ord) \
| `mdt_topology_place` \
| eval b=if(isl==0 AND row==$r$ AND side==0, ord - 200 * idx, null()) \
| streamstats max(b) as mb by isl row \
| eval x=if(isl==0 AND row==$r$, 200 * idx + coalesce(mb, 0), x) \
| eventstats avg(eval(if(isl==0 AND row==$r$ AND isnotnull(gb), gb - x, null()))) as shift \
| eval x=if(isl==0 AND row==$r$, round(x + coalesce(shift, 0)), x) \
| fields - known upx bv gb b mb shift
